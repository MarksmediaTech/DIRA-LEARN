# DIRA LEARN - deploy the Edge Functions to the NEW Supabase project. Manual only (Actions > deploy-supabase-functions >
# Run workflow), and only after the "production" environment's reviewer approves (set that up in Settings > Environments).
# Repository secrets needed (Settings > Secrets and variables > Actions), never in the code:
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the new project's reference id (Project Settings > General)
# The functions' own secrets (SETUP_CODE, FIRST_ADMIN_EMAIL, APP_URL, ...) are set in the Supabase Dashboard, not here.
# It does NOT touch the database: the database is installed with supabase/install in the SQL Editor (INSTALL_GUIDE.md).
name: deploy-supabase-functions
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project reference id again to confirm'
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Confirm the target project
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ -z "$REF" ]; then echo "SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ "$REF" != "$CONFIRM" ]; then echo "The confirmation does not match SUPABASE_PROJECT_REF. Nothing was deployed."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - name: Deploy the Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for f in bootstrap-first-admin invite-user import-learners complete-enrolment convert-application set-account-status send-emails email-webhook scan-attachments google-calendar-sync; do
            echo "== $f"; supabase functions deploy "$f" --project-ref "$REF" --use-api
          done
          echo "Done. bootstrap-first-admin, email-webhook and google-calendar-sync run with gateway JWT verification off (supabase/config.toml: they check their own secret or sign-in); all others keep it on."
