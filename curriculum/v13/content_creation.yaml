# DIRA LEARN V13 curriculum source: Content Creation specialist track. Six sessions of 120 minutes (timetable unchanged).
track: content
track_name: Content Creation
track_focus: >-
  Tell stories people stop for. Learners plan content with a strategy, tell stories, shoot photos and video on a phone with good light, composition and
  sound, edit video and audio, write captions, design graphics with a consistent brand, use content responsibly and legally, and finish with a content portfolio
  and a creative project for a real brief.
project: >-
  Final project - a content portfolio built around one creative project for a real brief (a business, a cause, a community or the learner's own creator
  brand). It contains a content strategy one-pager, at least one edited short video with captions, a photo set, a branded graphic or carousel, a credit
  and consent log, and a portfolio page or folder with short case-study notes, presented in session 8 with a 30-day content plan. Portfolio submissions
  for the programme use a restricted-access link shared only with named reviewers (for example a Google Drive folder set to "Restricted" and shared with
  the facilitator's email) or files uploaded in DIRA LEARN - never a public or "anyone with the link" link. A public portfolio is the learner's own optional
  choice, after consent checks. Privacy option: the brief can be simulated. Identifiable people appear only with consent recorded in the credit and consent
  log.
sessions:
- session_no: 3
  week_no: 2
  duration: 120
  title: Content strategy, storytelling and platform formats
  description: Plan content with a clear purpose, audience and niche, tell stories with a hook, a middle and an ending, and choose the right formats for
    each platform.
  purpose: >-
    Learners start the track as planners, not just posters. They define the purpose, audience and niche for their content, learn storytelling structures
    that hold attention, understand formats and specifications for each platform, and storyboard the first piece of their creative project.
  objectives:
  - Write a content strategy one-pager (purpose, audience, niche, goals, pillars, platforms, posting rhythm)
  - Explain the difference between creator content and brand content
  - Apply a story structure (hook, build, payoff, call to action) and the 'show, don't tell' principle
  - Compare content formats and specifications for TikTok, Instagram, YouTube, Facebook, WhatsApp status, LinkedIn and podcasts
  - Choose a real brief for the creative project
  - Storyboard a 30 to 60-second piece
  topics:
  - title: Content strategy and planning
    subtopics:
    - Purpose - why you create
    - Audience - who it is for
    - Niche - what you are known for
    - Goals and measures
    - Content pillars
    - Consistency and a realistic rhythm
    - Creator content versus brand content
  - title: Storytelling
    subtopics:
    - The hook in the first 2 seconds
    - Story arc - setup, tension, payoff
    - Character, conflict and change
    - Show, don't tell
    - Emotion and authenticity
    - Local stories and languages
  - title: Content formats for different platforms
    subtopics:
    - Short vertical video (TikTok, Reels, Shorts) 9:16
    - Feed photos and carousels (1:1 and 4:5)
    - Stories and WhatsApp status
    - Long-form video (YouTube 16:9)
    - Audio and podcasts
    - Text-led platforms (LinkedIn, X)
  segments:
  - minutes: 10
    title: Welcome to Content Creation and track overview
    kind: introduction
    summary: Meet your track group and see the six sessions and the final portfolio.
    steps:
    - >-
      Show the journey: S3 strategy, storytelling and formats, S4 photography, lighting, composition, mobile video and sound capture, S5 video editing,
      audio and captions, S6 design, branding, visual storytelling and copyright, S7 portfolio and project build, S8 showcase.
    - >-
      Show an example portfolio (fictional creator 'Otieno Shoots', a Kisumu creator making short videos for local food spots). Say that by session 8 each
      learner will have their own.
    - Ask learners to name a Kenyan creator they follow and why they keep watching.
  - minutes: 20
    title: Content strategy and planning
    kind: lesson
    summary: Learn how to define purpose, audience, niche, pillars and rhythm for content.
    steps:
    - >-
      Purpose: why are you creating - to build a personal creator brand, to promote a business, to educate a community, or to tell stories for a cause?
      Purpose decides everything else.
    - 'Audience: who exactly? ''Students in Eldoret who want to eat well on a budget'' is stronger than ''young people''.'
    - >-
      Niche: what you want to be known for. A niche can be a topic (budget food), a style (funny skits in Sheng), or a place (Kisumu). Broad creators struggle
      to grow; focused creators get remembered.
    - >-
      Goals: followers are not the only goal. Others include enquiries for a business, sign-ups for an event, saves and shares (people found it useful),
      or paid briefs.
    - >-
      Pillars and rhythm: three or four pillars (for example 'cheap eats reviews', 'cook with me', 'campus food news'). A rhythm you can keep for three
      months (for example three short videos a week) beats a burst followed by silence.
    - >-
      Creator content versus brand content: creators speak as themselves; brand content speaks for a business and follows its brand. Many creators earn
      by making brand content for clients - the portfolio will show both.
  - minutes: 20
    title: Storytelling
    kind: lesson
    summary: Learn story structures that hold attention, with local examples.
    steps:
    - >-
      The hook: the first 2 seconds decide whether people keep watching. Hooks - a surprising visual, a question ('Can you eat lunch for KES 100 in town?'),
      a bold statement, a result first ('This KES 500 room makeover...').
    - >-
      Story arc: setup (who and where), tension (a problem, a question or a challenge), payoff (the answer, the result, the emotion), call to action (follow,
      comment, visit).
    - >-
      Character, conflict and change: people connect with people. A mama mboga starting her day at 4 am at Marikiti market and selling out by noon is a
      story; 'we sell vegetables' is not.
    - 'Show, don''t tell: instead of saying ''our tailor is skilled'', show hands cutting fabric, a fitting and the client''s smile.'
    - >-
      Authenticity and language: speak like your audience - English, Kiswahili, Sheng or your local language - as long as your target audience understands.
      Add captions so more people can follow.
    - Play or describe two short examples and ask learners to identify the hook, tension and payoff.
  - minutes: 15
    title: Content formats for different platforms
    kind: lesson
    summary: Match formats and specifications to platforms and audiences.
    steps:
    - >-
      Short vertical video (TikTok, Instagram Reels, YouTube Shorts, Facebook Reels): 9:16 (1080 x 1920), usually 7 to 60 seconds for discovery content,
      strong hook, captions, trending or original audio.
    - 'Feed photos and carousels (Instagram, Facebook, LinkedIn): 1:1 (1080 x 1080) or 4:5 (1080 x 1350); carousels tell step-by-step or before-and-after
      stories.'
    - 'Stories and WhatsApp status: vertical, short-lived, informal - good for behind the scenes and daily updates.'
    - 'Long-form video (YouTube): 16:9 (1920 x 1080), for tutorials, vlogs and interviews; thumbnail and title matter.'
    - 'Audio and podcasts: interviews and conversations; good sound is essential.'
    - 'Text-led platforms (LinkedIn, X): opinions, lessons and professional updates, often with an image or video.'
    - Platform specifications and limits change; check each platform's current help pages before publishing.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 15
    title: Demonstration - from idea to storyboard
    kind: demonstration
    summary: Watch a story idea turned into a six-frame storyboard.
    steps:
    - 'Take an idea: ''A day with a boda boda rider who delivers lunch in Thika''. Write the hook, tension and payoff.'
    - >-
      Draw a six-frame storyboard: frame number, shot type (wide, medium, close-up), what we see, what we hear (voice, sound, music), on-screen text, duration.
      Total 30 to 45 seconds.
    - Show how the storyboard becomes a shot list for filming in session 4.
  - minutes: 20
    title: Strategy one-pager, brief and storyboard
    kind: exercise
    summary: Write your content strategy one-pager, choose your project brief and storyboard your first piece.
    steps:
    - 'Learners choose the creative project brief: (a) a local business (with the owner''s agreement), (b) a cause or community group, or (c) their own
      creator brand.'
    - Learners complete the strategy one-pager - purpose, audience, niche, goals, three or four pillars, main platforms, posting rhythm.
    - Learners storyboard one 30 to 60-second piece for the brief (six to eight frames) with a clear hook and payoff.
    - Learners without a device can draw the storyboard on paper and photograph it later.
  - minutes: 10
    title: Peer pitch and knowledge check
    kind: assessment
    summary: Pitch your storyboard in 30 seconds and answer quick questions.
    steps:
    - In groups of three, each learner pitches the storyboard in 30 seconds. Peers say whether the hook would stop them scrolling and suggest one improvement.
    - Ask two or three assessment questions aloud.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Remind learners to bring a charged phone with free storage to session 4 (shooting session).
    - Set the homework.
  demonstrations:
  - title: Idea to storyboard
    steps:
    - Turn an idea into a hook, tension and payoff, then draw a six-frame storyboard with shot types, audio and text.
  guided_exercises:
  - title: Story anatomy
    instructions: Watch two short videos and identify the hook, tension, payoff and call to action.
  individual_activities:
  - title: Content strategy one-pager
    instructions: Write your purpose, audience, niche, goals, pillars, platforms and posting rhythm.
  - title: Storyboard
    instructions: Storyboard a 30 to 60-second piece for your brief with six to eight frames.
  group_activities:
  - title: Storyboard pitch
    instructions: Pitch your storyboard in 30 seconds; peers judge the hook and suggest one improvement.
  examples:
  - A Kisumu creator reviewing affordable fish and ugali spots.
  - A mama mboga's 4 am start at Marikiti market told as a 40-second story.
  - A Nairobi tailor's 'fabric to fitting' transformation reel.
  - A community clean-up in Nakuru told as a before-and-after carousel.
  tools:
  - Phones, paper storyboard template, strategy one-pager template
  - Example videos (public, from Kenyan creators or prepared by the facilitator)
  - >-
    Free and low-data planning: paper storyboards and strategy templates need no device or data; example videos downloaded in advance on programme Wi-Fi
    and shown on one screen.
  assessment:
  - question: What is the difference between creator content and brand content?
    guide: Creator content speaks as the creator; brand content speaks for a business and follows its brand.
  - question: Write a hook for a video about cheap lunch spots in your town.
    guide: Grabs attention within 2 seconds - a question, bold claim, surprising visual or result first.
  - question: What does 'show, don't tell' mean?
    guide: Use visuals and actions to communicate instead of stating claims.
  - question: What is the aspect ratio and size for a TikTok or Reel?
    guide: 9:16, 1080 x 1920.
  - question: Name your niche and two content pillars.
    guide: Specific niche and pillars linked to the audience.
  expected_outputs:
  - Content strategy one-pager
  - Creative project brief
  - Storyboard for a 30 to 60-second piece
  facilitator:
    preparation:
    - Prepare two short example videos (public or your own) that show clear hooks and payoffs.
    - Prepare the strategy one-pager and storyboard templates.
    delivery:
    - Keep learners creating; theory segments should feel like inspiration, not lectures.
    - Push for specific audiences and niches.
    inclusion_and_safeguarding:
    - Learners working with a business or group must get the owner's or leader's agreement.
    - Content involving children needs a parent's or guardian's consent; discourage filming minors at all for this project.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Review storyboards and give one improvement each in DIRA LEARN.
    - Record attendance.
  homework:
  - Turn your storyboard into a shot list (every shot you need to film).
  - >-
    Visit or contact your brief (business or group) to plan filming and get consent. If you cannot get consent, or prefer not to work with a real brief,
    use the simulated brief from the facilitator and film objects, places or yourself.
  - Watch five videos in your niche and note the hooks used.
  cross_track_notes:
  - >-
    Digital Marketing plans content to reach a business goal through a campaign. Content Creation focuses on the craft - storytelling, production and the
    creator's portfolio - which can serve marketing but also education, causes and personal creator brands.
- session_no: 4
  week_no: 2
  duration: 120
  title: Smartphone photography, lighting, composition and mobile video
  description: Take clear, well-lit, well-composed photos and short videos on a phone, and capture clean sound.
  purpose: >-
    Learners master the phone as a camera. They learn composition rules, how to use natural light, camera settings that matter, shot types for video, stable
    filming and clean sound capture, then shoot a photo set and the clips for their storyboard.
  objectives:
  - Apply composition techniques (rule of thirds, leading lines, framing, angles, clean backgrounds, symmetry)
  - Use phone camera features (gridlines, focus and exposure lock, portrait mode, HDR) and avoid digital zoom
  - Use natural light well (window light, golden hour, avoiding harsh midday sun, simple reflectors)
  - Film stable shots in the right orientation using wide, medium and close-up shots and B-roll
  - Capture clean audio (quiet location, mic close to the speaker, avoiding wind and echo)
  - Shoot a five-photo set and the clips for their storyboard, with consent
  topics:
  - title: Photography using smartphones
    subtopics:
    - Clean the lens
    - Gridlines and focus/exposure lock
    - Portrait mode and HDR
    - Avoid digital zoom - move closer
    - Taking many shots and choosing the best
  - title: Lighting and composition
    subtopics:
    - Rule of thirds
    - Leading lines and framing
    - Angles - eye level, high, low
    - Clean backgrounds
    - Natural and window light
    - Golden hour and harsh midday light
    - DIY reflectors and diffusers
  - title: Mobile video production
    subtopics:
    - Vertical versus horizontal
    - Shot types - wide, medium, close-up
    - B-roll
    - Stable shots (two hands, lean on something, cheap tripod)
    - Hold each shot for 5 seconds
    - Simple movement - pan, push in, follow
  - title: Audio and sound (capture)
    subtopics:
    - Why audio matters more than picture
    - Quiet locations
    - Mic distance
    - Wired earphone and lapel mics
    - Wind, echo and background noise
    - Recording a test clip
  segments:
  - minutes: 10
    title: Recap and hooks you found
    kind: introduction
    summary: Share the hooks you noticed and check your shot list.
    steps:
    - Learners share one hook they noticed in their niche.
    - Check that each learner has a shot list and consent from their brief.
  - minutes: 20
    title: Composition and phone camera basics
    kind: lesson
    summary: Learn composition techniques and the camera settings that make the biggest difference.
    steps:
    - >-
      Demonstrate turning on gridlines (Android and iPhone camera settings). Teach the rule of thirds - place the subject on a line or intersection, not
      dead centre, unless symmetry is the point.
    - Leading lines (a road, a counter, a row of market stalls) draw the eye to the subject; framing (a doorway, a window, leaves) adds depth.
    - 'Angles: eye level for connection; low angle to make the subject look powerful; high angle (top-down) for food and products.'
    - 'Clean backgrounds: move the subject or yourself to remove clutter; a plain wall or kanga cloth can make a product pop.'
    - >-
      Camera basics: clean the lens with a soft cloth (phones in pockets get greasy); tap to focus and hold to lock focus and exposure; slide to adjust
      brightness; portrait mode for people and products; avoid digital zoom - move closer instead; take several shots and pick the best.
    - Show good and bad examples of each technique, using photos of Kenyan markets, food and people (with consent).
  - minutes: 15
    title: Lighting
    kind: lesson
    summary: Use natural light to make photos and videos look professional.
    steps:
    - Light is the biggest difference between amateur and professional-looking content. Natural light is free.
    - 'Window light: place the subject facing or beside a window, not with the window behind them (that creates a silhouette).'
    - >-
      Time of day: early morning and late afternoon (golden hour) give soft, warm light; midday sun in Kenya is harsh and creates strong shadows - move
      into open shade.
    - 'Backlight on purpose: for silhouettes or glowing hair, but expose for the face if you want it visible.'
    - >-
      DIY tools: a white manila sheet or foil-covered cardboard as a reflector; a white curtain or bedsheet to soften harsh light; a cheap LED ring light
      for night filming.
    - Demonstrate moving a product from a dark corner to window light and show the difference.
  - minutes: 15
    title: Mobile video production
    kind: lesson
    summary: Learn shot types, B-roll, stable filming and simple camera movement.
    steps:
    - 'Orientation: vertical (9:16) for TikTok, Reels, Shorts and status; horizontal (16:9) for YouTube. Decide before filming.'
    - >-
      Shot types: wide (where are we), medium (who and what are they doing), close-up (detail and emotion). A good sequence mixes them: wide market, medium
      vendor arranging tomatoes, close-up hands and a smile.
    - 'B-roll: extra footage that shows what is being talked about (hands working, the street outside, the product). Film more B-roll than you think you
      need.'
    - >-
      Stability: two hands, elbows tucked in, lean on a wall, use a cheap tripod or a stack of books. Hold each shot steady for at least 5 seconds so you
      have room to edit.
    - 'Movement: slow pan, push in (walk slowly towards the subject), follow (walk behind someone). Move slowly; fast movement looks shaky.'
    - 'Settings: film at 1080p and 30 frames per second as a safe default; check storage before you start.'
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 10
    title: Capturing clean sound
    kind: lesson
    summary: Record clear voice and avoid the most common sound problems.
    steps:
    - People forgive average video but not bad sound. Choose quiet places, away from matatu stages, generators and loud music.
    - 'Get the mic close: the phone or a wired earphone mic about 20 to 30 cm from the speaker''s mouth; a cheap lapel mic improves sound a lot.'
    - Avoid wind (shield the mic, record indoors or behind a wall) and echo (rooms with soft furnishings echo less than empty rooms).
    - Always record a 10-second test, listen with earphones, then record.
  - minutes: 30
    title: Practical shoot
    kind: exercise
    summary: Shoot a five-photo set and the clips for your storyboard.
    steps:
    - >-
      In pairs (they help each other), learners complete two tasks. Task 1 - a five-photo set for their brief: one wide, one medium, one close-up detail,
      one top-down or low angle, one portrait of a person with consent - each using a different composition technique and good light.
    - >-
      Task 2 - film the clips for their storyboard using the shot list, including at least three B-roll shots and one clean audio clip (a short voice line
      or interview answer).
    - >-
      The facilitator circulates and coaches on light, stability and sound. Learners filming off-site for their brief can do task 2 as homework but must
      shoot practice clips now.
    - Remind learners to ask permission before photographing anyone and not to film people who decline, or children without their parent's or guardian's
      consent.
  - minutes: 10
    title: Peer review of shots
    kind: assessment
    summary: Review each other's photos and clips with the shot checklist.
    steps:
    - >-
      Pairs review each other's best three photos and one clip with the checklist - focus sharp, well lit, composition technique visible, clean background,
      steady video, clear sound.
    - Each learner chooses one shot to reshoot and notes why.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Remind learners to back up their footage (cloud or computer) and to install a free video editing app before session 5.
    - Set the homework.
  demonstrations:
  - title: Light makes the difference
    steps:
    - Photograph the same product in a dark corner, at a window and with a reflector, and compare.
  - title: Shot sequence
    steps:
    - Film a wide, medium and close-up sequence plus B-roll of a simple action (making chai) and show it back.
  - title: Sound test
    steps:
    - Record a voice line far away, close up and with a wired earphone mic, and play all three.
  guided_exercises:
  - title: Composition hunt
    instructions: Take one photo for each technique - rule of thirds, leading lines, framing, low angle, top-down.
  individual_activities:
  - title: Five-photo set
    instructions: Shoot wide, medium, close-up, angle and portrait photos for your brief using good light and composition.
  - title: Storyboard clips
    instructions: Film the clips on your shot list, including three B-roll shots and one clean audio clip.
  group_activities:
  - title: Shoot pairs
    instructions: Work in pairs to shoot, hold reflectors and check each other's framing and sound.
  - title: Shot checklist review
    instructions: Review your partner's photos and clip with the checklist and choose one shot to reshoot.
  examples:
  - Food photos at a Kisumu fish spot using window light and a top-down angle.
  - A Nairobi tailor's hands as a close-up B-roll.
  - A Marikiti market wide shot using leading lines of the stalls.
  - Interviewing a youth group leader in a quiet church hall instead of beside a busy road.
  tools:
  - Smartphones with free storage, earphones with a mic, optional cheap tripod or lapel mic
  - White manila or foil reflector, a plain cloth background
  - Shot checklist
  - >-
    Low-cost kit: any smartphone camera; a stack of books or a cup as a tripod; white manila or foil as a reflector; a small room with curtains or clothes
    for clearer sound; learners without a camera phone shoot in pairs or threes.
  assessment:
  - question: Explain the rule of thirds.
    guide: Divide the frame into thirds horizontally and vertically; place the subject on the lines or intersections.
  - question: Your subject is standing with a bright window behind them and their face is dark. What do you do?
    guide: Turn them to face the window or move; expose for the face; use a reflector.
  - question: Name the three basic shot types and what each shows.
    guide: Wide (context), medium (action), close-up (detail, emotion).
  - question: Why should you avoid digital zoom?
    guide: It reduces quality; move closer instead.
  - question: Name two ways to improve sound when filming on a phone.
    guide: Quiet location, mic close, wired or lapel mic, shield from wind, test recording.
  expected_outputs:
  - Five-photo set for the brief
  - Storyboard clips including B-roll and a clean audio clip (complete or in progress)
  - Peer-reviewed shot checklist with a reshoot plan
  facilitator:
    preparation:
    - Prepare a product and a simple action for the demonstrations; bring a reflector and a cheap tripod if possible.
    - Identify safe, quiet shooting spots near the venue.
    delivery:
    - Most of the session should be hands-on; keep each lesson segment practical with a live demonstration.
    - Coach individually during the shoot; praise good light and composition loudly so others learn.
    inclusion_and_safeguarding:
    - Learners must ask permission before photographing or filming anyone; no filming of children without parental or guardian consent.
    - Safety when shooting outdoors - stay in groups, avoid dangerous roads and do not film police operations, military sites or restricted areas.
    - Learners with basic phones can still do composition and light exercises; pair them for video.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Check that every learner has footage to edit in session 5.
    - Record attendance.
  homework:
  - Complete any missing storyboard clips and reshoot the shot you chose.
  - Back up your footage and install a free editor (for example CapCut, InShot or VN; check the app's current terms).
  - Take five more photos using golden-hour light.
  cross_track_notes:
  - Digital Marketing asks learners to take real product photos for campaigns; Content Creation teaches the full photography and video craft behind them.
- session_no: 5
  week_no: 3
  duration: 120
  title: Video editing, audio and sound, captions and creative writing
  description: Edit a short video on a phone, improve audio and add music legally, write on-screen captions and post captions, and export for each platform.
  purpose: >-
    Learners turn raw footage into a finished short video. They learn editing principles and practise them in a free mobile editor, improve sound and use
    music legally, write on-screen captions for accessibility and post captions that connect, and export correctly for each platform.
  objectives:
  - Apply editing principles (hook first, cut on action, pacing, jump cuts, sequences, minimal transitions)
  - Edit a 30 to 60-second video in a free mobile editor (trim, split, arrange, speed, text, audio, colour)
  - Improve audio (levels, noise reduction, voice-over) and use music legally (platform libraries, royalty-free, licensed)
  - Add accurate on-screen captions for accessibility and check auto-captions
  - Write a post caption using creative writing techniques with a hook and call to action
  - Export with the right settings for each platform
  topics:
  - title: Video editing
    subtopics:
    - Hook first - put the best moment at the start
    - Cut on action and remove dead time
    - Pacing and rhythm
    - Jump cuts and sequences
    - Transitions - less is more
    - Speed changes
    - Colour and brightness basics
    - Aspect ratio and safe zones
  - title: Audio and sound (editing)
    subtopics:
    - Balancing voice and music levels
    - Noise reduction
    - Recording a voice-over
    - Sound effects
    - Music licensing - platform libraries, royalty-free and licensed music
    - Why using popular songs without permission can get content removed or muted
  - title: Captions and creative writing
    subtopics:
    - On-screen captions for accessibility and silent viewing
    - Checking auto-captions (names, Kiswahili, Sheng)
    - Writing post captions - hook, value, story, call to action
    - Hashtags and keywords
    - Voice and tone
  segments:
  - minutes: 10
    title: Recap and footage check
    kind: introduction
    summary: Check your footage is ready and learn today's plan.
    steps:
    - Learners confirm they have their clips and a free editor installed. Pair anyone without footage with a partner's clips or the facilitator's sample
      footage.
    - Show a before (raw clips) and after (finished 40-second video) to show what they will make today.
  - minutes: 20
    title: Editing principles and demonstration
    kind: demonstration
    summary: Learn the editing principles and watch a short video edited step by step.
    steps:
    - >-
      Principles: (1) hook first - start with the most interesting moment, not 'Hi guys'; (2) cut dead time - remove pauses, setup and repeated shots; (3)
      cut on action - cut when something moves so the edit feels natural; (4) pacing - change shot every 2 to 4 seconds for short-form; (5) sequences -
      wide, medium, close-up; (6) transitions - simple cuts are best, flashy effects distract.
    - >-
      Live edit in a free mobile editor (for example CapCut, InShot or VN): import clips, put them in storyboard order, trim the start and end of each clip,
      split and delete a mistake, move the best shot to the start, adjust speed of one B-roll shot, add a title text, adjust brightness and contrast slightly.
    - 'Safe zones: keep text and faces away from the bottom and right edges where platform buttons and captions cover the screen.'
  - minutes: 25
    title: Edit your video
    kind: exercise
    summary: Edit your 30 to 60-second video using the principles.
    steps:
    - Learners edit their storyboard footage into a 30 to 60-second video, following the principles and their storyboard (they may improve the story while
      editing).
    - 'Checkpoint at 15 minutes: the hook is in the first 2 seconds and there is no dead time.'
    - The facilitator circulates and helps with the app.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 15
    title: Audio and sound - editing and legal music
    kind: lesson
    summary: Improve sound, add a voice-over and use music legally.
    steps:
    - 'Levels: voice must be clearly louder than music; lower the music under speech (many editors call this ducking or allow manual volume).'
    - 'Noise reduction: use the editor''s noise reduction feature if available; it cannot fix very bad recordings, so capture well.'
    - 'Voice-over: record in a quiet room close to the phone, speak slowly and clearly, re-record mistakes.'
    - >-
      Music licensing: songs belong to their creators and labels. Platforms such as TikTok and Instagram provide music libraries that are licensed for use
      on that platform within their terms; business accounts may have fewer choices. Royalty-free libraries (for example the YouTube Audio Library) provide
      music you can use under their terms. Using a popular Kenyan or international song from elsewhere without a licence can get your video muted or removed,
      or lead to a copyright claim.
    - Learners add music or a voice-over to their video and balance the levels.
  - minutes: 15
    title: Captions and creative writing
    kind: lesson
    summary: Add accurate on-screen captions and write a post caption that connects.
    steps:
    - >-
      On-screen captions: many people watch without sound, and captions make content accessible to people who are deaf or hard of hearing. Use the editor's
      auto-captions, then correct every error - names, places, Kiswahili and Sheng words are often wrong. Keep two lines maximum, high contrast, inside
      the safe zone.
    - >-
      Post caption structure: hook (first line visible before 'more'), value or story (what the viewer gets, or the story behind the video), call to action
      (follow, comment, share, visit), and a few relevant hashtags or keywords that people actually search.
    - >-
      Creative writing techniques: specific details ('the smell of mandazi at 6 am in Kariokor'), a question to start conversation, humour that fits the
      audience, and short sentences.
    - Learners add on-screen captions and write the post caption.
  - minutes: 15
    title: Finish and export
    kind: exercise
    summary: Finish your video and export it correctly for your platform.
    steps:
    - 'Final check: hook, no dead time, sound levels, captions correct, text in safe zones, ending with a call to action or logo.'
    - >-
      Export: 1080p, 30 fps for most platforms; 9:16 for short vertical video; save a copy to the cloud. Remove the editor's watermark only if the app's
      terms allow it.
    - Learners save the final video in their DIRA LEARN portfolio folder.
  - minutes: 10
    title: Screening and knowledge check
    kind: assessment
    summary: Screen a few videos and give feedback.
    steps:
    - Screen three or four videos (volunteers). The group gives feedback on the hook, pacing, sound and captions.
    - Ask two or three assessment questions.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Set the homework and remind learners to bring their brand ideas to session 6.
  demonstrations:
  - title: Live mobile edit
    steps:
    - Import, order, trim, split, reorder for the hook, speed change, title, brightness, export.
  - title: Audio balance and captions
    steps:
    - Add music, lower it under the voice, generate auto-captions and correct errors.
  guided_exercises:
  - title: Find the hook
    instructions: Look through your clips and choose the strongest 2-second moment to open your video.
  individual_activities:
  - title: Edited short video
    instructions: Edit a 30 to 60-second video with a strong hook, no dead time, balanced audio, corrected captions and a call to action.
  - title: Post caption
    instructions: Write a caption with a hook, value or story, call to action and relevant hashtags.
  group_activities:
  - title: Screening
    instructions: Watch volunteers' videos and give feedback on hook, pacing, sound and captions.
  examples:
  - A 40-second 'mandazi at 6 am in Kariokor' video with a voice-over in Kiswahili and English captions.
  - A Mombasa creator whose video was muted for using a popular song, re-uploaded with platform-library music.
  - Auto-captions turning Kenyan place names into nonsense, corrected by hand.
  tools:
  - Free mobile video editor (for example CapCut, InShot or VN - check current terms and availability)
  - Earphones; learners' footage; facilitator's sample footage as a backup
  - Editing checklist and caption template
  - >-
    Free editors: CapCut, InShot or VN (check current terms) or the phone's built-in editor. Low storage: edit a 30-second version. Low data: download the
    editor and any music on programme Wi-Fi and export at 720p.
  assessment:
  - question: Why should the best moment come first in a short video?
    guide: Viewers decide in the first 2 seconds whether to keep watching.
  - question: What does 'cut on action' mean?
    guide: Cutting during a movement so the transition feels natural.
  - question: Why add on-screen captions?
    guide: Silent viewing, accessibility for deaf and hard of hearing viewers, clarity.
  - question: Where can you get music you are allowed to use?
    guide: Platform music libraries within their terms, royalty-free libraries under their licences, music you have permission or a licence for, your own
      music.
  - question: What export settings are a safe default for short vertical video?
    guide: 1080 x 1920 (9:16), 1080p, 30 fps.
  expected_outputs:
  - Edited 30 to 60-second video with captions and legal audio
  - Post caption with hook and call to action
  facilitator:
    preparation:
    - Install and test the editor yourself; prepare sample footage for learners who have none.
    - Prepare a before-and-after example video.
    delivery:
    - Learners progress at different speeds; pair confident editors with beginners.
    - Do not try to teach every feature; teach the 20% that gives 80% of the result.
    inclusion_and_safeguarding:
    - Phones with little storage struggle; let learners edit a shorter video or use a partner's phone.
    - Remind learners that content must respect the consent given by the people filmed.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Review the videos in the portfolio folder and give one improvement each.
    - Record attendance.
  homework:
  - Improve your video based on the screening feedback.
  - Collect your logo, colours or style references for your brief (or start thinking about your creator brand).
  - >-
    Publish your video on your own account or the brief's account (with permission) and note views, watch time and comments after 48 hours. Private option:
    share it through a restricted link with named people only, or submit it only in DIRA LEARN, and collect feedback from three people instead of public
    views.
  cross_track_notes:
  - >-
    Digital Marketing covers persuasive captions and copywriting tied to a sale. Content Creation covers captions as accessibility and creative writing
    that builds an audience.
- session_no: 6
  week_no: 3
  duration: 120
  title: Graphic design, visual storytelling, branding and responsible content
  description: >-
    Apply graphic design fundamentals, tell stories visually in carousels and posters, keep content consistent with a brand, and use content legally and
    responsibly.
  purpose: >-
    Learners design graphics that look professional and tell a story, create a content brand kit and templates that keep their content consistent, and learn
    the copyright, consent and responsibility rules every creator must follow. They make a branded post, poster and carousel and start a credit and consent
    log.
  objectives:
  - Apply the design principles contrast, repetition, alignment and proximity, plus typography and colour basics
  - Use grids and hierarchy to lay out a poster and a social post
  - Tell a story across a carousel (hook slide, steps or before-and-after, payoff, call to action)
  - Create a content brand kit (colours, fonts, logo or signature, templates, voice, recurring series)
  - Explain copyright basics in Kenya, licences, Creative Commons, consent and model releases, and platform rules
  - Keep a credit and consent log for all content
  topics:
  - title: Graphic design fundamentals
    subtopics:
    - Contrast
    - Repetition
    - Alignment
    - Proximity
    - Typography - two fonts, sizes and weights
    - Colour - palettes and meaning
    - Grids and hierarchy
    - Readable on a phone
  - title: Visual storytelling
    subtopics:
    - Carousels as stories
    - Before-and-after
    - Step-by-step
    - Simple infographics
    - Thumbnails and covers
    - Posters for events and causes
  - title: Content branding and consistency
    subtopics:
    - Creator or brand kit
    - Templates
    - Recurring series and formats
    - Consistent voice
    - Signature elements (intro, colours, sound)
  - title: Copyright and responsible content use
    subtopics:
    - What copyright protects
    - Kenya's Copyright Act and the Kenya Copyright Board (KECOBO)
    - Licences and permission
    - Creative Commons and stock sites
    - Fair dealing is limited - not a free pass
    - Consent and model releases
    - Children and vulnerable people
    - Misinformation, defamation and hate speech
    - Platform community guidelines
    - Disclosing paid partnerships and AI-generated content
  segments:
  - minutes: 10
    title: Recap and video results
    kind: introduction
    summary: Share the results of the video you published.
    steps:
    - Learners share views, watch time or comments from their published video and one thing they learned.
    - Introduce today - design, brand and the rules that protect creators and the people they feature.
  - minutes: 20
    title: Graphic design fundamentals
    kind: lesson
    summary: Learn the principles that make graphics look professional.
    steps:
    - >-
      Teach CRAP with good and bad examples: Contrast (make the important thing different - size, colour, weight); Repetition (repeat colours, fonts and
      styles so it feels like one design); Alignment (everything lines up with something; use the grid); Proximity (group related items, separate unrelated
      ones).
    - >-
      Typography: maximum two fonts - one for headings, one for body; use size and weight for hierarchy; avoid decorative fonts for long text; check readability
      at phone size.
    - >-
      Colour: a palette of two or three main colours plus neutrals; colours carry meaning (green - fresh, growth; red - urgency, passion); ensure strong
      contrast between text and background.
    - 'Grids and hierarchy: decide the one thing viewers should notice first, second and third. Use margins and consistent spacing.'
    - Redesign a cluttered event poster live (a youth football tournament poster with five fonts and no hierarchy) into a clean one.
  - minutes: 15
    title: Visual storytelling
    kind: lesson
    summary: Tell stories across carousels, posters and covers.
    steps:
    - >-
      Carousel structure: slide 1 hook (a bold question or promise), slides 2 to 6 the story (steps, before-and-after, tips), last slide payoff and call
      to action (save, share, follow, visit).
    - 'Before-and-after: a room makeover, a hairstyle, a cleaned-up river bank; consistent angle makes it powerful.'
    - 'Simple infographics: one idea, few numbers, clear icons; always credit the data source.'
    - 'Thumbnails and covers: a face with emotion, three to five words, high contrast.'
    - 'Posters for events and causes: what, when, where, who, how to join - the 5Ws in hierarchy.'
  - minutes: 15
    title: Content branding and consistency
    kind: lesson
    summary: Build a brand kit and templates so your content is recognisable.
    steps:
    - Explain why consistency matters - people should recognise your content in a busy feed before seeing your name.
    - >-
      Brand kit contents: logo or signature mark, two or three colours with codes, two fonts, photo and video style (bright, moody, natural), voice (playful,
      calm, expert), recurring series ('Cheap Eats Friday'), intro or outro style, and three templates (post, carousel, story).
    - Show 'Otieno Shoots' brand kit as an example.
    - Demonstrate saving a template in Canva (or similar) and reusing it with new content.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 20
    title: Copyright and responsible content use
    kind: lesson
    summary: Learn the legal and ethical rules for using and creating content.
    steps:
    - >-
      Copyright protects original works - photos, videos, music, designs, writing - from the moment they are created. In Kenya, the Copyright Act sets the
      rules and the Kenya Copyright Board (KECOBO) administers copyright matters. Owning a copy (downloading a photo) does not give you the right to reuse
      it.
    - >-
      To use others' work you need permission or a licence. Sources: your own content, the brief owner's content with permission, Creative Commons works
      (follow the licence - attribution, non-commercial, no derivatives), and free stock sites under their licence terms. Keep the licence link in your
      credit log.
    - >-
      Fair dealing (limited uses such as criticism, review or news reporting) exists in many laws, but it is narrow and not a free pass to use songs, films
      or photos in your content. When in doubt, do not use it or ask permission.
    - >-
      Consent: get clear permission before filming or photographing people for content, and written permission (a model release - a simple signed or WhatsApp-confirmed
      agreement) when the content is for a business or will be used widely. Never post children without their parent's or guardian's consent, and avoid
      identifying vulnerable people.
    - >-
      Responsibility: do not spread misinformation (check facts before posting), do not defame (false statements that damage someone's reputation), avoid
      hate speech and content that incites violence, follow platform community guidelines, disclose paid partnerships ('#ad', 'paid partnership') and AI-generated
      content.
    - 'Protecting your own work: add a subtle signature or watermark on photos, keep original files, and know you can report stolen content to platforms.'
  - minutes: 20
    title: Design a branded post, poster and carousel
    kind: exercise
    summary: Create your brand kit and three branded designs, and start your credit and consent log.
    steps:
    - Learners create their content brand kit for their brief (or creator brand) in Canva or on paper.
    - >-
      They design three pieces using the kit: a social post, an event or promotional poster, and a three to five-slide carousel that tells a story (hook,
      story, payoff and CTA).
    - >-
      They start a credit and consent log - every image, music track, font or video not made by them (source, licence, link) and every person who appears
      (consent obtained, how, date).
  - minutes: 10
    title: Peer critique and knowledge check
    kind: assessment
    summary: Give design feedback using the CRAP checklist and answer questions.
    steps:
    - In pairs, learners critique each other's designs with the CRAP checklist and the 3-second test.
    - Ask two or three assessment questions, especially about copyright and consent.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Remind learners that session 7 is the portfolio build - all pieces and logs must be ready.
    - Set the homework.
  demonstrations:
  - title: Poster redesign
    steps:
    - Redesign a cluttered poster live by applying contrast, repetition, alignment and proximity.
  - title: Saving and reusing a template
    steps:
    - Create a branded template and reuse it for a new post in under two minutes.
  guided_exercises:
  - title: Licence check
    instructions: Find one image on a free stock site and one Creative Commons image, and record the licence conditions for each.
  individual_activities:
  - title: Content brand kit
    instructions: Create a brand kit with colours, fonts, signature, style, voice, a recurring series and three templates.
  - title: Three branded designs
    instructions: Design a post, a poster and a carousel that use your kit and tell a clear story.
  - title: Credit and consent log
    instructions: Record the source and licence of everything you did not create, and the consent for everyone who appears.
  group_activities:
  - title: Design critique
    instructions: Critique a partner's designs with the CRAP checklist and the 3-second test.
  examples:
  - Redesigning a Nakuru youth football tournament poster.
  - The 'Otieno Shoots' brand kit with a 'Cheap Eats Friday' series.
  - A Kibera recycling group carousel showing a dumpsite before and after a clean-up.
  - A creator whose video was removed after using a film clip without permission.
  tools:
  - Canva (free) or a similar design tool; paper and pens as a backup
  - CRAP checklist, brand kit template, credit and consent log template, simple model release template
  - Free stock and Creative Commons sources (follow their licence terms)
  - 'Free design options: Canva free, the phone''s built-in markup tools, or a paper layout photographed in good light; design offline where possible.'
  assessment:
  - question: What do the letters in CRAP stand for?
    guide: Contrast, Repetition, Alignment, Proximity.
  - question: You downloaded a photo from Google Images. Can you use it in a client's poster?
    guide: Not without permission or a licence that allows it; downloading does not give the right to reuse.
  - question: What is a model release and when do you need one?
    guide: Written permission from a person to use their image; needed for business or widely used content.
  - question: Name three things in a content brand kit.
    guide: Colours, fonts, logo or signature, style, voice, templates, recurring series.
  - question: What must you do when content is a paid partnership?
    guide: Disclose it clearly (for example
  expected_outputs:
  - Content brand kit with three templates
  - Branded post, poster and carousel
  - Credit and consent log (started)
  facilitator:
    preparation:
    - Prepare the cluttered poster, the example brand kit and templates, and the model release template.
    - Read KECOBO's public guidance so you can answer basic questions accurately; do not give legal advice.
    delivery:
    - Keep design theory visual; show before-and-after every time.
    - Make copyright practical - ask learners to audit the content they used in their session 5 video.
    inclusion_and_safeguarding:
    - Consent and images of children are safeguarding issues as well as legal ones; be firm.
    - Learners must not use content that sexualises, humiliates or targets anyone.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Check credit and consent logs in the portfolio folders.
    - Record attendance.
  homework:
  - Finish all three designs and fix the issues from the critique.
  - Complete your credit and consent log for everything made so far, including your video.
  - Choose the three to five best pieces for your portfolio.
  cross_track_notes:
  - >-
    Digital Marketing teaches a business brand identity to make a campaign consistent and persuasive. Content Creation teaches design and branding as a
    creative discipline and how a creator's own brand is built across content.
  - AI Tools covers AI images and disclosure; here learners learn traditional design and the legal rules that apply to all content.
- session_no: 7
  week_no: 4
  duration: 120
  title: Portfolio development and creative project build
  description: Build a content portfolio and complete the creative project for your brief, test it with peers and prepare the showcase.
  purpose: >-
    Learners pull their work together into a professional content portfolio and complete their final creative project for a real brief. They learn what
    clients and employers look for, write short case-study notes, finish production, test with peers and prepare their showcase presentation.
  objectives:
  - Explain what makes a strong content portfolio (best three to five pieces, variety, results, story behind each piece)
  - Choose a portfolio platform (Google Drive folder, Behance, Instagram highlights, a simple website), and submit it through a restricted-access link or
    DIRA LEARN
  - Write a short case study for one piece (brief, idea, process, result, learning)
  - Complete the creative project to a publishable standard
  - Improve the project based on peer testing
  - Explain basic freelance terms (brief, deliverables, revisions, deadline, rate) in simple language
  topics:
  - title: Portfolio development
    subtopics:
    - What clients and employers look for
    - Quality over quantity - three to five best pieces
    - Showing variety (video, photo, design)
    - Case-study notes
    - Portfolio platforms
    - Keeping the credit and consent log with the portfolio
  - title: Working with clients (introduction)
    subtopics:
    - Brief and deliverables
    - Revisions and deadlines
    - Simple pricing ideas and agreeing payment before work
    - Delivering files professionally
  - title: Creative project completion
    subtopics:
    - Finishing production
    - Quality check
    - Peer testing
    - Revising
  segments:
  - minutes: 10
    title: Project check-in
    kind: introduction
    summary: Confirm your brief, your best pieces and what is left to make.
    steps:
    - Each learner states their brief and what is left to finish in one sentence.
    - >-
      Remind learners of the final project contents (strategy one-pager, edited video, photo set, branded designs, credit and consent log, portfolio with
      case-study notes).
  - minutes: 15
    title: What makes a strong portfolio
    kind: lesson
    summary: Learn how to present your work so clients and employers take you seriously.
    steps:
    - 'Quality over quantity: three to five best pieces beat twenty average ones. Show variety - at least one video, one photo set and one design.'
    - >-
      Context: for each piece, add a short case study - the brief (who and what), the idea, your process (what you did and tools), the result (views, saves,
      client feedback, event turnout), and what you learned. Results can be small; be honest.
    - >-
      Platforms: a Google Drive folder with a clear index (easy and free), Behance (design), Instagram with highlights by category, or a simple free website.
      Use a professional username and add contact details. For programme submissions, use restricted sharing (named people only) or upload the files in
      DIRA LEARN; making a portfolio public is optional and only after the consent log is checked.
    - >-
      Working with clients (for example a Nakuru cafe paying KES 3,000 for four short reels, half paid upfront by M-Pesa): agree the brief, deliverables,
      deadline, number of revisions and price in writing (WhatsApp is fine) before starting; agree a deposit for larger jobs; deliver files in the right
      format and size. Never pay someone for a 'job' - that is a scam.
    - Show the 'Otieno Shoots' portfolio index and one case study.
  - minutes: 45
    title: Creative project production
    kind: exercise
    summary: Finish every piece of your creative project and build your portfolio.
    steps:
    - Learners finish production - final edits, reshoots if needed, designs, captions.
    - They build their portfolio (folder or platform) with three to five best pieces and write one full case study and short notes for the others.
    - 'Checkpoint at 25 minutes: the facilitator checks each learner has a finished video and design.'
    - The facilitator circulates for one-to-one coaching on quality and on the credit and consent log.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 20
    title: Peer testing
    kind: group
    summary: Test your portfolio and project with peers using the checklist.
    steps:
    - >-
      In groups of three, each learner shows their portfolio for 3 minutes. Peers use the portfolio checklist: strong first piece, variety, case-study notes,
      quality (light, sound, design), consistency with brand, credits and consent recorded, contact details.
    - Each peer gives two strengths and two improvements.
  - minutes: 15
    title: Revise and prepare the showcase
    kind: exercise
    summary: Make improvements and prepare your three-minute showcase.
    steps:
    - Learners make at least one improvement from the feedback.
    - >-
      They prepare the showcase: self-pitch introduction, the brief, show the project (play the video, show designs), explain one creative choice and one
      result, what they learned, what next.
  - minutes: 10
    title: Showcase briefing and homework
    kind: conclusion
    summary: Learn the showcase format and what to submit.
    steps:
    - Explain the showcase format (3 minutes plus 2 minutes of questions) and share the rubric.
    - Set the homework.
  demonstrations:
  - title: Portfolio walkthrough
    steps:
    - Show a complete example portfolio index and read one case study aloud.
  guided_exercises:
  - title: Case study
    instructions: Write a case study for your best piece - brief, idea, process, result, learning.
  individual_activities:
  - title: Creative project completion
    instructions: Finish every piece of your creative project to a publishable standard.
  - title: Portfolio build
    instructions: >-
      Build a portfolio with three to five best pieces, case-study notes, contact details and the credit and consent log. Submit it for the programme only
      as a restricted-access link shared only with named reviewers (for example a Google Drive folder set to "Restricted" and shared with the facilitator's
      email) or files uploaded in DIRA LEARN, not as a public or "anyone with the link" link.
  group_activities:
  - title: Portfolio peer test
    instructions: Show your portfolio to two peers, who use the checklist to give two strengths and two improvements.
  examples:
  - The 'Otieno Shoots' portfolio with a food video, a photo set and a carousel, each with a short case study.
  - A Nyeri creator who got a paid brief from a local cafe after sharing a Google Drive portfolio link.
  - A youth group media team in Kilifi documenting a beach clean-up for a conservation organisation.
  tools:
  - All tools from the track (phone, editor, design tool)
  - Portfolio checklist, case-study template, simple client brief template
  - >-
    Free portfolio platforms: a Google Drive folder with "Restricted" sharing (named people only), or a single PDF or files uploaded in DIRA LEARN, for
    the programme submission; Behance (free) only if the learner chooses a public portfolio later. Compress videos to 720p to save data.
  assessment:
  - question: Portfolio checked with the portfolio checklist.
    guide: All checklist items present; first piece strong; credits and consent recorded.
  - question: What should you agree in writing with a client before starting work?
    guide: Brief, deliverables, deadline, revisions, price and payment terms.
  expected_outputs:
  - Completed creative project (video, photo set, branded designs)
  - Content portfolio with three to five pieces, case-study notes and contact details
  - Completed credit and consent log
  - Showcase presentation draft
  facilitator:
    preparation:
    - Prepare the example portfolio and case study, the portfolio checklist and the client brief template.
    - >-
      Set the session 8 room plan from the track group size (up to 12 - one room; 13 to 24 - two rooms; 25 to 36 - three rooms, or two live rooms plus a
      recorded-questions room) and line up co-facilitators and peer panels.
    delivery:
    - Protect the production time; this is where projects get finished.
    - Prioritise coaching learners who are behind.
    inclusion_and_safeguarding:
    - Check consent logs before any content featuring people goes into a public portfolio.
    - Remind learners not to publish personal phone numbers; use a business number or email.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Check that every learner has a complete project; message those at risk.
    - Record attendance.
    - >-
      Before marking, check that every portfolio submission is a restricted-access link or a DIRA LEARN upload; ask learners to change any public or "anyone
      with the link" sharing first.
  homework:
  - Finish your portfolio and project and upload them to DIRA LEARN.
  - Practise your showcase presentation twice within three minutes.
  - Ask your brief owner for a short comment on the work (a testimonial) if they are happy to give one.
  - >-
    If you are presenting by recording (a large group, or you cannot present live), record your 3-minute project and portfolio presentation - video, or
    a voice note with slides for low data - and upload it to DIRA LEARN by the day before session 8.
  cross_track_notes:
  - Every track builds its final project in session 7. The Content Creation project is judged on storytelling, production quality and responsible content
    use.
- session_no: 8
  week_no: 4
  duration: 120
  title: Content showcase
  description: Present your creative project and portfolio, explain your creative choices, give and receive feedback, pitch yourself and plan your next
    30 days of content.
  purpose: >-
    Learners present their creative project and portfolio, explain their creative and ethical choices, and answer questions. They practise pitching themselves
    as creators to clients and employers, show professional behaviour in a showcase setting and leave with a 30-day content plan.
  objectives:
  - Present the creative project and portfolio clearly in three minutes
  - Explain at least one creative choice and one responsible-content choice
  - Give and receive feedback professionally using the rubric
  - Pitch themselves as a creator with the portfolio as proof
  - Write a 30-day content plan
  topics:
  - title: Presenting creative work
    subtopics:
    - Showcase structure
    - Explaining creative choices
    - Answering questions
  - title: Pitching yourself and your work
    subtopics:
    - Creator self-pitch
    - Sharing your portfolio link professionally
    - Talking about rates and briefs
  - title: Professional behaviour and workplace readiness
    subtopics:
    - Showcase etiquette
    - Receiving critical feedback
    - Following up with clients and guests
    - Pathways - employment, freelance, creator brand, media and NGO communications
  - title: Next steps
    subtopics:
    - 30-day content plan
    - Staying consistent
  segments:
  - minutes: 10
    title: Showcase set-up and expectations
    kind: introduction
    summary: Learn the showcase order, rubric and etiquette.
    steps:
    - Welcome learners and guests (brief owners, DIRA staff, mentors, employers). Thank brief owners.
    - >-
      Share the rubric: storytelling and strategy (20%), production quality - photo, video, sound (25%), design and brand consistency (20%), responsible
      content - credits, consent, honesty (15%), presentation and answers (20%).
    - Assign each learner two presenters to give written feedback to.
  - minutes: 30
    title: Project presentations and questions - block 1
    kind: assessment
    summary: The first six presenters in each room present and answer questions; give rubric feedback to your two assigned peers.
    steps:
    - >-
      Run the screenings with the session 8 room plan in the facilitator instructions: the first six presenters in each room go in this block, each with
      3 minutes plus 2 minutes of questions.
    - Learners present in order, 3 minutes each plus 2 minutes of questions. Play videos with sound checked in advance.
    - >-
      Ask at least one question per presenter, such as: 'Why did you open with that shot?', 'What would you change with more time?', 'How did you get consent?',
      'What result did this piece get?'
    - Score with the rubric and note one strength and one improvement.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 30
    title: Project presentations and questions - block 2
    kind: assessment
    summary: The next six presenters in each room present; recorded presenters answer their live questions.
    steps:
    - Presenters 7 to 12 in each live room now show their projects and portfolios; check the sound before each video and keep the block 1 timer, rubric
      and questions.
    - >-
      In a recorded-questions room, do not replay the recordings (the panel scored them before the session); give each recorded presenter 2 minutes of live
      questions about their creative project and portfolio.
    - Each room's panel hands its completed creative project and portfolio rubric sheets to the room facilitator before the feedback round.
  - minutes: 10
    title: Feedback round
    kind: group
    summary: Share feedback and learn from patterns across projects.
    steps:
    - Learners give written feedback to their two assigned presenters.
    - Facilitator highlights patterns in strong projects - strong hooks, good light and sound, consistent brand, clear credits.
  - minutes: 15
    title: Pitching yourself and workplace readiness
    kind: lesson
    summary: Practise pitching yourself as a creator and learn the pathways for creative work.
    steps:
    - >-
      Creator pitch formula: who you are, what you make and for whom, proof (a piece and its result), the ask. Example: 'I am Wanjiku, a Nyeri content creator.
      I make short videos that help small cafes get noticed - my last video for a local cafe got 12,000 views and the owner says weekend visits went up.
      I am looking for two more cafes to work with this month.'
    - 'Sharing your portfolio: a short link, a clean index, and a message that introduces you and the value you offer - not ''please check my page''.'
    - >-
      Pathways: employment (social media assistant, videographer, communications assistant at an NGO or company), freelance briefs, building a creator brand,
      media houses and production companies. Rates vary; start by agreeing clear deliverables and never paying to get work.
    - 'Professional follow-up: thank brief owners and guests within two days, deliver final files, ask for a testimonial.'
    - Learners practise their pitch once in pairs.
  - minutes: 15
    title: 30-day content plan
    kind: exercise
    summary: Write your plan for the next 30 days of content.
    steps:
    - >-
      Learners complete the 30-day content plan: main goal, pillars, posting rhythm, four weekly actions (for example week 1 publish two portfolio pieces,
      week 2 pitch three local businesses, week 3 start a recurring series, week 4 review analytics), a measure, an accountability partner and one risk.
    - Learners share their goal with their accountability partner.
  - minutes: 5
    title: Celebration and close
    kind: conclusion
    summary: Celebrate and learn what happens next.
    steps:
    - Celebrate each learner's project in one sentence.
    - >-
      Explain how to submit the portfolio (a restricted-access link or files uploaded in DIRA LEARN, never a public link), creative project and credit and
      consent log in DIRA LEARN, how results and certificates follow the programme's rules, and how alumni can share paid briefs with each other.
  demonstrations:
  - title: Model showcase
    steps:
    - Before the session, share a recorded 3-minute example presentation as a reference. Do not use showcase time for it.
  guided_exercises:
  - title: Portfolio message
    instructions: Write a three-sentence message introducing yourself and your portfolio link to a potential client.
  individual_activities:
  - title: Showcase presentation
    instructions: Present your project and portfolio in three minutes and answer questions for two minutes.
  - title: 30-day content plan
    instructions: Complete the plan with goal, pillars, rhythm, weekly actions, measure, partner and risk.
  group_activities:
  - title: Peer feedback
    instructions: Give rubric-based written feedback to two assigned presenters.
  - title: Pitch practice
    instructions: Practise your creator pitch in pairs.
  examples:
  - A Nyeri creator pitching cafes with a 12,000-view video as proof.
  - A Kilifi youth media team showing a conservation clean-up documentary.
  - A Kisumu photographer using the portfolio to apply for an NGO communications internship.
  tools:
  - Projector or screen sharing with sound, learners' portfolios
  - Showcase rubric, feedback cards or DIRA LEARN, timer, 30-day plan template
  - 'Low-data showcase: play every video from a downloaded file; online learners share their link or file in advance.'
  assessment:
  - question: Presentation scored with the content showcase rubric.
    guide: Use rubric descriptors; honest results and responsible content choices count.
  - question: Explain one creative choice and one responsible-content choice in your project.
    guide: A specific, reasoned example of each.
  - question: Deliver your creator pitch.
    guide: Who, what for whom, proof, ask.
  expected_outputs:
  - Presented creative project and portfolio (final project) with rubric score and feedback
  - Portfolio message and creator pitch
  - 30-day content plan
  - Written feedback given to two peers
  facilitator:
    preparation:
    - Test video playback with sound for every learner before the session; collect files in advance where possible.
    - Invite brief owners and guests; brief guests on respectful questions and safeguarding expectations.
    - >-
      Confirm the room plan: count the learners in the track group, book the rooms and co-facilitators, brief the peer panels, and publish each room's presenter
      order and the list of recorded presenters by the end of session 7.
    delivery:
    - Keep strict time; celebrate creativity and honest reflection.
    - >-
      Session 8 room plan - Room plan (set in session 7 from the track group size; the session is never extended): up to 12 learners - one room; 13 to 24
      - two rooms in parallel; 25 to 36 - three rooms, or two live rooms plus one recorded-questions room. Each live room takes at most 12 presenters: 6
      in each 30-minute block, 3 minutes to present and 2 minutes of questions each.
    - >-
      Every room has a facilitator or briefed co-facilitator (another trainer, a mentor or DIRA staff member who knows the rubric and the safeguarding expectations)
      and a peer panel of two learners who present in the other block. All rooms use the same rubric.
    - >-
      Recorded option: learners in a recorded-questions room, and anyone who cannot present live (absence, connection problems, anxiety, or the privacy
      option), submit a 3-minute recording - video, or a voice note with slides for low data - by the day before session 8. The panel scores it in advance
      with the same rubric; in session 8 each recorded presenter answers 2 minutes of live questions (12 per block). If more learners need the recorded
      option than one room can take, the panel sends written questions and the learner answers them in DIRA LEARN.
    - 'Timekeeping: a visible timer with a 30-second warning; stop at 3 minutes. If a block runs late, cut questions to 1 minute - do not extend the session.'
    inclusion_and_safeguarding:
    - Learners who cannot present live can submit a recorded presentation according to the programme's rules.
    - Guests must not contact learners privately outside programme channels.
    - >-
      Shared devices and low data: learners without a suitable phone shoot and edit in pairs or threes and take turns as camera operator, presenter and
      editor; plan uploads and downloads for programme Wi-Fi. Never require a paid app, premium template or paid music.
    after_session:
    - Enter rubric scores and feedback in DIRA LEARN grading.
    - Record attendance.
  homework:
  - Submit the final project, your portfolio (restricted-access link or files uploaded in DIRA LEARN) and the 30-day plan in DIRA LEARN.
  - Thank your brief owner and deliver the final files.
  cross_track_notes:
  - >-
    Every track ends with the same pitch-yourself and workplace-readiness segment; the Content Creation rubric weights storytelling, production quality
    and responsible content.
