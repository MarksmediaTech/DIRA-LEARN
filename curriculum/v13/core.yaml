# DIRA LEARN V13 curriculum source: shared core (Week 1). Every learner takes these two sessions before track learning.
# Durations are the approved timetable values (110 and 115 minutes) and must not change. Segment minutes must add up exactly.
track: core
sessions:
- session_no: 1
  week_no: 1
  duration: 110
  title: Self-leadership, confidence and wellbeing
  description: Know your strengths and values, start your personal brand, set a four-week goal and build habits that keep you well and confident at work.
  purpose: >-
    Learners start the programme knowing what they are good at, what they care about and what they want from the next four weeks. They turn this self-knowledge
    into the first draft of a personal brand statement, practise confident behaviour they will need at work and in the programme, and learn where to get
    support. Everything later in DIRA LEARN (track projects, the showcase and the 30-day plan) builds on the goal card and personal brand statement made
    today.
  objectives:
  - Describe at least three personal strengths, two interests and two values, with an example of each from real life
  - Write a first-draft personal brand statement (two sentences) based on strengths, values and the help they can offer others
  - Set one SMART four-week learning goal and name the first step they will take this week
  - Practise three confident workplace behaviours (introducing yourself, asking for help, accepting feedback)
  - Identify two wellbeing habits and one support route they can use during the programme
  - Explain the programme expectations, the learning agreement and how to raise a safeguarding concern
  topics:
  - title: Programme orientation and learning agreement
    subtopics:
    - How the four weeks work (core, then one specialist track)
    - What a good learning space looks like
    - Respect, consent and privacy in groups and online
    - How to raise a concern, and the support contacts the programme has formally confirmed
  - title: Strengths, interests and values
    subtopics:
    - Strengths versus skills
    - Where strengths show up (school, family, church or mosque, chama, part-time work)
    - Values as decision rules
    - Spotting strengths in others
  - title: Self-leadership and confidence
    subtopics:
    - Self-leadership - choosing your response
    - The confidence loop (prepare, act, reflect)
    - Fixed and growth mindset
    - Self-talk that helps and self-talk that hurts
  - title: Personal branding (introduction)
    subtopics:
    - What a personal brand is and is not
    - Strengths plus values plus the help you offer
    - Consistency between what you say and what you do
    - First-draft personal brand statement
  - title: Confidence at work
    subtopics:
    - Introducing yourself
    - Asking for help without apologising
    - Receiving feedback without defending
    - Speaking up in a meeting or a WhatsApp group
  - title: Wellbeing and resilience
    subtopics:
    - Sleep, movement, food and screen time
    - Stress signals
    - Small recovery habits
    - Where to get support (friends, family, mentors, DIRA staff, professional help)
  - title: Goal setting and accountability
    subtopics:
    - SMART goals
    - First steps
    - Accountability partners
    - Tracking progress in DIRA LEARN
  segments:
  - minutes: 10
    title: Welcome and learning agreement
    kind: introduction
    summary: Meet the facilitator, see how the four weeks work and agree how the group will learn together.
    steps:
    - Welcome learners by name as they join. Start on time even if some are late; latecomers will catch up in the icebreaker.
    - >-
      Show the programme map on one slide: Week 1 shared core (sessions 1 and 2), Weeks 2 to 4 specialist track (sessions 3 to 8), session 8 is the showcase.
      Say: everything you make in this programme goes into a portfolio you can show an employer, a client or a funder.
    - >-
      Build the learning agreement with the group. Ask: what do you need from each other to learn well? Write their answers. Make sure these five appear:
      respect different views, one person speaks at a time, cameras or attention on, what is shared personally stays in the room, phones on silent unless
      used for an activity.
    - >-
      Explain safeguarding in plain words. If anyone, inside or outside the programme, makes you feel unsafe, tell the facilitator or use the support option
      in DIRA LEARN. Share only the support contacts that programme management has formally confirmed for this cohort (from the facilitator briefing). If
      a Safeguarding Lead or Deputy has been formally appointed and confirmed, name them; if not, do not name anyone or suggest that someone holds the role
      - say that concerns go to the facilitator or the DIRA LEARN support option and are passed to programme management. Do not promise secrecy; say concerns
      are shared only with the people who need to act on them.
    - Ask everyone to type or say 'I agree' to the learning agreement. Save it and post it in the cohort space after the session.
  - minutes: 10
    title: Icebreaker - two truths and a strength
    kind: group
    summary: Introduce yourself with two true facts and one strength, and guess the strengths of others.
    steps:
    - 'Model it first: ''I am Wanjiru from Nakuru, I sell second-hand shoes on weekends, and one strength I have is patience with difficult customers.'''
    - In breakout groups of four (or around the room), each learner gives their name, where they are from, two true facts and one strength. Give 60 seconds
      each.
    - Group members name one more strength they heard in the story (for example, the shoe seller also shows planning and negotiation).
    - Bring the group back. Ask three volunteers to share a strength someone else spotted in them. Point out that others often see strengths we overlook.
  - minutes: 20
    title: Values, confidence and self-leadership mini-workshop
    kind: lesson
    summary: Learn the difference between strengths, skills and values, and how self-leadership and self-talk shape confidence.
    steps:
    - >-
      Explain three words. A skill is something you learned to do (typing, cooking, editing video). A strength is something you do well and that energises
      you (listening, organising, making people laugh). A value is something that matters to you and guides decisions (honesty, family, faith, independence,
      community).
    - >-
      Values exercise (5 minutes). Show a list of 20 values. Learners choose five, then cut to two. Ask: when did one of these two values help you make
      a hard decision? Two volunteers share.
    - >-
      Teach self-leadership: you cannot control everything that happens, but you can choose your response. Use the example of a learner whose phone data
      runs out before a session: blame and miss it, or plan ahead (buy a bundle early, download materials, tell the facilitator).
    - 'Teach the confidence loop: prepare, act, reflect. Confidence comes after action, not before it. Each small action you reflect on makes the next one
      easier.'
    - >-
      Self-talk. Read two sentences: 'I always mess up presentations' and 'My last presentation was nervous, so this time I will practise twice.' Ask which
      one helps. Learners rewrite one unhelpful sentence they say to themselves.
    - >-
      Explain growth mindset in one sentence - abilities grow with practice and feedback. Connect it to the programme - you are not expected to be good
      at digital marketing, AI, content or business yet; you are expected to practise.
  - minutes: 20
    title: Strengths map and personal brand statement
    kind: exercise
    summary: Map your strengths, interests and values, and turn them into a first-draft personal brand statement.
    steps:
    - >-
      Hand out or share the strengths map template: four boxes - Strengths, Interests, Values, Help I can offer others. Learners fill each box with at least
      two items and one real example (8 minutes).
    - >-
      Explain personal branding. Your personal brand is what people say about you when you are not in the room. It is built from what you are good at, what
      you stand for and how you help others, shown consistently online and offline. It is not pretending or showing off.
    - >-
      Give the formula: I am a [strength] person who cares about [value]. I help [who] to [what] by [how]. Example: 'I am an organised and patient person
      who cares about honesty. I help small shops in my estate to keep customers coming back by answering messages quickly and politely.'
    - Learners write their own two-sentence statement (5 minutes). Circulate and help anyone stuck by asking what friends usually ask them for help with.
    - Three volunteers read their statements. Give one specific compliment and one improvement each (for example, make the 'who' more specific).
    - Tell learners they will improve this statement in session 2 (online profile) and use it in the session 8 showcase.
  - minutes: 10
    title: Confidence at work - practice rounds
    kind: exercise
    summary: Practise introducing yourself, asking for help and receiving feedback in short role-plays.
    steps:
    - >-
      Demonstrate three phrases. Introducing: 'Good morning, I am Brian, I am new in the team and I will be supporting customer orders.' Asking for help:
      'I have tried X and Y, could you show me how you would do Z?' Receiving feedback: 'Thank you, can you give me an example so I can improve it?'
    - >-
      In pairs, learners take turns using each phrase in a work scenario (a first day at a supermarket, an internship at a county office, a client call
      for a small design job). Two minutes per person.
    - Ask the group which phrase felt hardest and why. Note that asking for help after trying something shows initiative, not weakness.
  - minutes: 15
    title: Wellbeing and resilience
    kind: lesson
    summary: Recognise stress signals, choose small habits that help and know where to get support.
    steps:
    - >-
      Ask learners to name signs of stress they notice in themselves (poor sleep, irritability, scrolling for hours, headaches, avoiding people). Write
      them down without judgement.
    - >-
      Teach four basics: sleep (a regular time helps more than long weekend sleep), movement (a 10-minute walk counts), food and water, and screen boundaries
      (no phone for the first 30 minutes after waking, mute busy groups).
    - 'Teach one recovery tool: the 4-4-6 breath (breathe in for 4, hold for 4, out for 6, repeat three times). Practise it together once.'
    - >-
      Support routes: a trusted friend or family member, a mentor, the facilitator, DIRA staff through the support option, and professional help. Say clearly
      that if anyone feels unsafe or is thinking of harming themselves, they should tell someone immediately and contact the emergency services or a crisis
      line; the facilitator will share the programme's approved contacts.
    - Each learner writes two wellbeing habits they will keep during the four weeks on their goal card.
  - minutes: 15
    title: SMART goal and accountability partner
    kind: exercise
    summary: Write one SMART four-week goal with a first step and agree check-ins with an accountability partner.
    steps:
    - >-
      Explain SMART - Specific, Measurable, Achievable, Relevant, Time-bound. Weak goal: 'learn marketing'. SMART goal: 'By the end of week 4 I will create
      and present a basic marketing campaign for my aunt's cereals shop and get feedback from two real customers.'
    - Learners write their goal and their first step for this week on the goal card (5 minutes).
    - >-
      Pair learners as accountability partners (from different tracks if possible). Partners read each other's goals and make one suggestion to make it
      more measurable.
    - >-
      Partners agree how they will check in (for example a WhatsApp message every Sunday evening). Remind them to keep messages respectful and on topic,
      and that they can tell the facilitator if a partnership is not working.
  - minutes: 10
    title: Reflection and exit ticket
    kind: assessment
    summary: Complete the baseline self-assessment and an exit ticket so the facilitator can see where everyone is starting.
    steps:
    - Learners complete the baseline self-assessment in DIRA LEARN or on paper (confidence 1 to 5 in communication, digital skills, teamwork and goal setting).
    - 'Exit ticket - three sentences: one thing I learned about myself today, one thing I will do before session 2, one question I still have.'
    - >-
      Close: thank learners, remind them of the session 2 date and time from the timetable, and ask them to bring a phone or computer with access to their
      social media or LinkedIn account if they have one.
  demonstrations:
  - title: Modelling a personal brand statement
    steps:
    - Write your own strengths map live (keep it honest and simple).
    - Turn it into a statement using the formula, thinking aloud about each choice.
    - Show a weak version ('I am hardworking and passionate') next to the improved one, and explain why specific beats general.
  - title: Confidence phrases
    steps:
    - Act out a poor example first (mumbling an introduction, apologising for asking a question), then the confident version.
    - Ask learners what changed (eye contact, clear name and role, specific question).
  guided_exercises:
  - title: Values cut-down
    instructions: Choose five values from the list, cut to two, and write one moment when each guided a decision.
  - title: Rewrite your self-talk
    instructions: Write one unhelpful sentence you say to yourself, then rewrite it as a helpful sentence that includes an action.
  individual_activities:
  - title: Strengths map
    instructions: Fill the four boxes (Strengths, Interests, Values, Help I can offer) with at least two items each and one real example.
  - title: Personal brand statement
    instructions: Write a two-sentence statement using the formula. Keep it true, specific and about how you help others.
  - title: Goal card
    instructions: Write one SMART goal, your first step this week and two wellbeing habits.
  group_activities:
  - title: Two truths and a strength
    instructions: In groups of four, share two true facts and one strength; others spot an extra strength in your story.
  - title: Confidence practice rounds
    instructions: In pairs, practise introducing yourself, asking for help and receiving feedback in a work scenario.
  examples:
  - >-
    A young woman in Kisumu who sells second-hand clothes online shows strengths in negotiation and photography that later become her personal brand as
    a reliable mitumba curator.
  - A boda boda rider in Thika who organises his stage's welfare contributions shows leadership and trust, strengths an employer in logistics would value.
  - A church youth leader in Eldoret who runs the WhatsApp group for 200 members shows communication and moderation skills.
  - A learner preparing for an interview at a Nairobi supermarket chain uses the three confidence phrases on her first day as a merchandiser.
  tools:
  - Slides or flip chart with the programme map and the learning agreement
  - Strengths map and goal card templates (printed or as a shared document)
  - List of 20 values (printed or on a slide)
  - Baseline self-assessment (DIRA LEARN or paper)
  - Timer
  assessment:
  - question: Name three of your strengths and give a real example of one of them.
    guide: Look for strengths (not just skills) with a concrete example. Prompt with 'when did you do that?' if the example is vague.
  - question: What is the difference between a skill, a strength and a value?
    guide: Skill is learned ability; strength is what you do well and that energises you; value is what matters and guides decisions.
  - question: Read your personal brand statement. Who do you help, and how?
    guide: The statement should name a specific group of people and a specific way of helping. 'Everyone' or 'many things' needs narrowing.
  - question: Is your four-week goal SMART? Which part is the measurable part?
    guide: There should be a number, a deliverable or a clear observable result and a date (end of week 4).
  - question: Where can you go for support during the programme if you are struggling or feel unsafe?
    guide: >-
      Any of the facilitator, the DIRA LEARN support option, a confirmed support contact shared in the session (including a formally appointed Safeguarding
      Lead or Deputy, if one was named), a mentor, a trusted adult, or emergency services for immediate danger.
  expected_outputs:
  - Completed strengths map (strengths, interests, values, help I can offer)
  - First-draft personal brand statement (two sentences)
  - Goal card with a SMART four-week goal, first step and two wellbeing habits
  - Accountability partner agreed
  - Baseline self-assessment and exit ticket submitted
  facilitator:
    preparation:
    - Check the DIRA LEARN cohort list and attendance register before the session; mark attendance in DIRA LEARN within the session.
    - Prepare the programme map slide, the values list, the strengths map and goal card templates.
    - >-
      Before the session, get from programme management the support contacts formally confirmed for this cohort, and whether a Safeguarding Lead and Deputy
      have been formally appointed. Share only confirmed contacts and appointments. Never invent a contact or name someone who has not been formally appointed.
    - Write your own strengths map and personal brand statement in advance so you can model them.
    delivery:
    - Keep the energy high in the first 20 minutes; this session sets the tone for the whole programme.
    - Use learners' names often. Praise effort and specifics, not just talent.
    - Watch the time on the strengths map; learners who are stuck often need one question ('what do friends ask you for help with?').
    inclusion_and_safeguarding:
    - Values and wellbeing discussions can bring up personal difficulties. Never force anyone to share; allow 'pass'.
    - >-
      If a learner discloses harm or risk, do not investigate. Listen, reassure, explain who you must tell, and record and escalate it through the DIRA
      LEARN safeguarding process the same day (immediately if urgent).
    - Learners with low data or older phones can complete templates on paper and photograph them later.
    after_session:
    - Post the learning agreement in the cohort space.
    - Check exit tickets and answer common questions at the start of session 2.
    - Note any learner who seemed withdrawn or did not participate and check in privately.
  homework:
  - Show your personal brand statement to one person who knows you well and ask whether it sounds like you. Improve it.
  - Take your first step towards your four-week goal and message your accountability partner by the end of the week.
  - If you have social media or LinkedIn, look at your profile and note one thing that does not match your personal brand statement (you will fix it in
    session 2).
  cross_track_notes:
  - >-
    The personal brand statement made here is reused in session 2 (online profile) and in every track's session 8 showcase, where learners pitch themselves
    and their project.
- session_no: 2
  week_no: 1
  duration: 115
  title: Digital foundations, AI awareness and communication
  description: >-
    Work safely and professionally online, understand what AI can and cannot do, communicate clearly, build a professional online presence and pitch yourself
    in 30 seconds.
  purpose: >-
    Learners build the shared digital, communication and workplace-readiness foundation every specialist track depends on. They learn safe and professional
    online conduct, organise their learning files, see what AI tools can and cannot do, practise clear written and spoken communication, improve one professional
    online profile using their personal brand statement and deliver a 30-second self-pitch. They leave having confirmed their specialist track.
  objectives:
  - Apply five rules of professional online conduct (email, WhatsApp, video calls) and organise a programme folder
  - Explain three things AI tools can help with, three limitations and why human checking is always required
  - Write a clear prompt and improve the output using verification and their own judgement
  - Write a professional message and an email with a clear subject, greeting, request and sign-off
  - Improve one professional online profile (LinkedIn, Instagram bio, WhatsApp about or Facebook) so it matches their personal brand
  - Deliver a 30-second self-pitch and give respectful feedback to a peer
  - Recognise common online scams and privacy risks and know how to respond
  - Confirm their specialist track choice with a reason
  topics:
  - title: Digital foundations for learning and work
    subtopics:
    - Files and folders (cloud and phone)
    - Naming files so you can find them
    - Strong passwords and two-step verification
    - Data-saving habits
  - title: Professional behaviour and workplace readiness online
    subtopics:
    - Email and WhatsApp etiquette
    - Video-call etiquette
    - Response times and reliability
    - Respectful disagreement
    - Punctuality and keeping commitments
  - title: AI awareness
    subtopics:
    - What AI tools are
    - What they are good at
    - Limitations (errors, made-up facts, bias, out-of-date information)
    - Privacy - what never to paste into an AI tool
    - Human judgement and disclosure
  - title: Communication and self-presentation
    subtopics:
    - Clear messages (purpose, audience, request)
    - Tone
    - Listening and summarising
    - Body language and voice on camera
  - title: Professional online presence
    subtopics:
    - Profile photo, headline and bio
    - Matching your personal brand statement
    - What employers and clients check
    - Privacy settings
  - title: Pitching yourself
    subtopics:
    - The 30-second self-pitch (who, strength, proof, ask)
    - Adapting it for an employer, client or funder
  - title: Online safety
    subtopics:
    - Common scams in Kenya (fake jobs, M-Pesa reversal requests, fake prizes)
    - Phishing links
    - Sextortion and image-based abuse - what to do
    - Reporting and support
  - title: Track confirmation
    subtopics:
    - The four specialist tracks
    - Matching the track to your goal
  segments:
  - minutes: 5
    title: Recap and digital confidence pulse check
    kind: introduction
    summary: Recap session 1 and rate your digital confidence.
    steps:
    - Answer two or three common questions from the session 1 exit tickets.
    - >-
      Quick poll (hands, chat or DIRA LEARN): rate yourself 1 to 5 on finding files, writing emails, using AI tools, staying safe online. Note the lowest-scoring
      area and give it a little extra time today.
  - minutes: 15
    title: Digital foundations and professional conduct
    kind: lesson
    summary: Organise your programme files, secure your accounts and learn the rules of professional online behaviour.
    steps:
    - >-
      Demonstrate a programme folder in Google Drive or on a phone: DIRA LEARN > Week 1, Week 2, Week 3, Week 4, Portfolio. Show a good file name: '2026-11
      Wanjiru Kamau - goal card.pdf'. Bad: 'IMG_2034.jpg'.
    - >-
      Passwords: use a long passphrase (three random words plus a number), a different password for email, and turn on two-step verification on email, WhatsApp
      and social media. Show where the WhatsApp two-step setting is (Settings > Account > Two-step verification).
    - >-
      Professional conduct - five rules: (1) reply within one working day, even if only to say when you will answer fully; (2) greet and sign off; (3) one
      clear request per message; (4) no voice notes for work requests unless the other person prefers them; (5) be on time for calls and test your audio
      and camera first.
    - >-
      Workplace readiness: punctuality, keeping promises, telling your supervisor early when you will miss a deadline, dressing appropriately for video
      calls and for the workplace, respecting confidentiality. Ask: which of these have you seen go wrong at a job or a group project?
  - minutes: 20
    title: AI awareness and prompt practice
    kind: demonstration
    summary: See what an AI assistant can and cannot do, write a prompt and check the output.
    steps:
    - >-
      Explain simply: AI assistants (such as ChatGPT, Gemini, Copilot, Claude or Meta AI in WhatsApp) predict useful text from patterns in huge amounts
      of data. They can draft, summarise, explain and brainstorm. They do not 'know' facts the way a reference book does, and can be confidently wrong.
    - >-
      Live demo: ask an AI tool 'Write a short introduction message for a young person applying for an internship at a county government office.' Show the
      result. Then improve the prompt with role, task, context and format: 'You are a careers adviser. Write a 60-word WhatsApp message for Kevin, 21, from
      Machakos, who has a certificate in ICT and wants an internship at the Machakos County ICT office. Friendly and professional tone.' Compare.
    - >-
      Show a limitation: ask the tool for a fact that changes (for example the current minimum wage or an application deadline) and explain that answers
      must be checked against an official source.
    - 'Privacy rule: never paste ID numbers, M-Pesa PINs, passwords, other people''s private messages or personal health details into an AI tool.'
    - >-
      Learners try one prompt for their own introduction message and improve it twice. They mark what they changed themselves (facts, tone, details AI got
      wrong). Learners without a device pair with someone who has one.
    - Disclosure rule for DIRA LEARN work - if AI helped, say how in one line (for example 'First draft by AI, edited and fact-checked by me').
  - minutes: 15
    title: Clear communication practice
    kind: exercise
    summary: Write a professional message and email, and practise listening and summarising.
    steps:
    - >-
      Teach the PAR structure - Purpose (why I am writing), Audience (who will read it), Request (what I want them to do). Show a poor message: 'Hi, am
      interested in the job pls reply.' Show a good one with greeting, who you are, which job, why you fit in one line, clear request, thanks and name.
    - >-
      Learners write an email to a fictional employer (Subject: Application - Sales Assistant, Nyeri branch) with greeting, two-sentence introduction, request
      for an interview, sign-off and phone number. 5 minutes.
    - >-
      Pair activity - listening: one partner explains their four-week goal for 60 seconds, the other summarises it in one sentence starting 'So what you
      want to achieve is...'. Swap.
    - Ask two pairs to share. Highlight that summarising shows respect and avoids misunderstandings at work.
  - minutes: 20
    title: Professional online presence and self-pitch
    kind: exercise
    summary: Improve one online profile so it matches your personal brand, then deliver a 30-second self-pitch.
    steps:
    - >-
      Show two LinkedIn or Instagram profiles of fictional young Kenyans side by side. One: blurry photo, headline 'student', no bio, party photos public.
      Two: clear photo, headline 'Content creator | Helping Kisii small businesses get seen online', short bio, contact, examples of work.
    - >-
      Learners improve one profile they already have (or draft one on paper): profile photo, headline (role or aim plus who you help), bio from their personal
      brand statement, contact method, one thing to hide or delete. Check privacy settings so personal phone numbers and home locations are not public.
      8 minutes.
    - >-
      Teach the 30-second self-pitch - Who I am, my strength, proof (one example), my ask. Example: 'I am Achieng from Homa Bay. I am good at explaining
      things simply - I tutor three Form Two students in maths. I am joining the Digital Marketing track and I am looking for a small business I can practise
      with.'
    - >-
      In pairs, each learner delivers the pitch twice; the partner gives one 'keep' and one 'improve'. Remind them this pitch will grow into their session
      8 showcase introduction.
  - minutes: 15
    title: Online safety scenarios
    kind: group
    summary: Spot scams and privacy risks in real-looking scenarios and decide what to do.
    steps:
    - >-
      Groups of four get one scenario each: (1) a WhatsApp job offer asking for a KES 1,500 'registration fee'; (2) an SMS saying 'I have sent you M-Pesa
      by mistake, please send it back' with no matching M-Pesa message from the official sender; (3) a stranger on Instagram asking for private photos and
      then threatening to share them; (4) a link to 'claim your free data bundle'.
    - 'Each group answers: what are the warning signs, what should you do now, who can you tell, how can you report it. 6 minutes.'
    - >-
      Groups report back. Key teaching points: real employers do not charge application fees; check your actual M-Pesa balance and messages rather than
      reacting to an SMS; never send money or codes under pressure; for threats or image-based abuse do not pay, keep evidence (screenshots), block and
      report on the platform, tell a trusted person and the facilitator; image-based abuse and threats are crimes that can be reported to the police.
    - >-
      Remind learners that the facilitator, the DIRA LEARN support option and the confirmed support contacts shared in session 1 are available if something
      like this happens during the programme.
  - minutes: 10
    title: Core module check and track confirmation
    kind: assessment
    summary: Complete the short core knowledge check and confirm your specialist track.
    steps:
    - Learners complete the 8-question core knowledge check (see assessment).
    - >-
      Present the four tracks in one minute each - Digital Marketing (reach and win customers online and run a campaign), AI Tools (use AI responsibly to
      work faster and better), Content Creation (photos, videos and design that tell stories), Entrepreneurship & Business (turn an idea into a tested business
      concept and pitch).
    - >-
      Learners confirm their track in DIRA LEARN with one sentence on how it connects to their four-week goal. Remind them the track choice follows the
      programme's rules in DIRA LEARN; anyone unsure should speak to the facilitator before the deadline.
  - minutes: 15
    title: Reflection, digital safety checklist and next steps
    kind: conclusion
    summary: Complete the digital safety checklist, reflect on the week and prepare for your track.
    steps:
    - >-
      Learners tick the digital safety checklist: two-step verification on email and WhatsApp, strong unique email password, privacy settings checked, programme
      folder created, profile improved.
    - 'Reflection round: each learner says one word for how they feel about starting their track, and one action for this week.'
    - Explain what happens in week 2 (first track session) and what to bring (a charged phone, data or Wi-Fi, their programme folder).
    - >-
      Thank learners for completing the core. Remind them that attendance at both core sessions is required before track learning, following the programme's
      attendance rules in DIRA LEARN.
  demonstrations:
  - title: Organising a programme folder and turning on two-step verification
    steps:
    - Create the folder structure live in Google Drive or on a phone's file manager.
    - Rename a badly named file to the standard format.
    - Open WhatsApp settings and show where two-step verification is (do not enter a real PIN on screen).
  - title: Prompt improvement live
    steps:
    - Type a weak prompt and show the generic output.
    - Add role, task, context and format; show the improved output.
    - Find one error or invented detail and correct it, explaining why human checking matters.
  - title: Profile before and after
    steps:
    - Show a fictional weak profile and talk through what an employer would think.
    - Edit the same profile into a strong one, reading the new headline and bio aloud.
  guided_exercises:
  - title: Prompt and improve
    instructions: Write a prompt for your own introduction message, improve it twice and note what you corrected yourself.
  - title: Professional email
    instructions: Write an application email with a clear subject line, greeting, two-sentence introduction, request and sign-off.
  individual_activities:
  - title: Profile upgrade
    instructions: >-
      Improve one online profile (photo, headline, bio, contact, privacy) so it matches your personal brand statement. Private option: draft the improvements
      in a document without changing a public profile.
  - title: Digital safety checklist
    instructions: Complete and tick every item on the checklist; ask for help with any you cannot do.
  - title: Track confirmation
    instructions: Confirm your track in DIRA LEARN with one sentence linking it to your four-week goal.
  group_activities:
  - title: Listening and summarising pairs
    instructions: Explain your goal for 60 seconds; your partner summarises it in one sentence. Swap.
  - title: Self-pitch pairs
    instructions: Deliver your 30-second pitch twice; your partner gives one 'keep' and one 'improve'.
  - title: Online safety scenarios
    instructions: In groups, identify warning signs, actions and reporting routes for a scam or abuse scenario.
  examples:
  - Fake job adverts on WhatsApp and Facebook that ask Kenyan job seekers for 'registration' or 'medical' fees before an interview.
  - SMS messages claiming 'I have sent you money by mistake' that try to trick people into sending M-Pesa to strangers.
  - >-
    A Nakuru graduate whose LinkedIn headline changed from 'Student' to 'Junior accountant | Helping small businesses keep clean records' and who started
    receiving recruiter messages.
  - Using Meta AI in WhatsApp to draft a polite message to a landlord, then checking the facts before sending.
  tools:
  - Phone or computer with internet (pairs for learners without a device)
  - Google Drive or phone file manager
  - An AI assistant (any free one available in Kenya, such as ChatGPT, Gemini, Copilot or Meta AI)
  - LinkedIn, Instagram, Facebook or WhatsApp (learners' own accounts, optional)
  - Online safety scenario cards, digital safety checklist and core knowledge check
  assessment:
  - question: Name three things an AI assistant can help with and two of its limitations.
    guide: >-
      Helps with drafting, summarising, explaining, brainstorming, translating. Limits include wrong or invented facts, out-of-date information, bias, no
      understanding of your situation.
  - question: List three pieces of information you must never paste into an AI tool.
    guide: Passwords and PINs, ID or passport numbers, other people's private messages or data, health or financial details, confidential work information.
  - question: What does PAR stand for in a professional message?
    guide: Purpose, Audience, Request.
  - question: A WhatsApp job offer asks you to pay KES 1,500 before the interview. What do you do?
    guide: Do not pay. Real employers do not charge fees. Verify the company through official channels, report and block, tell the facilitator.
  - question: Why should you turn on two-step verification on WhatsApp and email?
    guide: It protects the account if someone gets your password or SIM; the attacker also needs the PIN or second step.
  - question: Deliver your 30-second self-pitch. Did it include who, strength, proof and ask?
    guide: Observe all four parts and a clear ask. Use the pitch rubric (clarity, confidence, specific proof).
  - question: What would an employer think of your online profile? Name one change you made.
    guide: Expect a concrete change such as photo, headline, bio or privacy setting.
  - question: Which track did you confirm and how does it connect to your goal?
    guide: The link should be explicit (for example 'Business track because my goal is to test my juice business idea').
  expected_outputs:
  - Programme folder with the standard file names
  - Short professional introduction message created with AI support, improved and checked by the learner, with a one-line AI disclosure
  - Professional application email
  - Improved online profile (or paper draft) matching the personal brand statement
  - Delivered 30-second self-pitch
  - Completed digital safety checklist and core knowledge check
  - Confirmed specialist track
  facilitator:
    preparation:
    - Test the AI tool, screen sharing and the internet connection before the session. Prepare a backup screenshot of the AI demo in case the connection
      fails.
    - Prepare the fictional before-and-after profiles (never use a real learner's profile without permission).
    - Print or share the scenario cards, the digital safety checklist and the core knowledge check.
    - Check the track selection rules and deadline in DIRA LEARN so you can answer questions accurately.
    delivery:
    - This session is full; keep segments to time and use a visible timer.
    - In the AI demo, model checking and disclosure every time; learners copy what you do, not what you say.
    - Profiles - learners should only change their own accounts. Do not ask anyone to log in on a shared device.
    inclusion_and_safeguarding:
    - >-
      Online safety scenarios may be close to learners' real experiences. Offer a private conversation after the session and follow the DIRA LEARN safeguarding
      process if a learner discloses abuse or exploitation.
    - Learners without smartphones work in pairs or on paper; never shame anyone for their device or data.
    - Remind learners to keep personal phone numbers and home locations off public profiles.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    after_session:
    - Record attendance and core completion in DIRA LEARN.
    - Check that every learner has confirmed a track; follow up with those who have not.
    - Share the slides, checklist and templates in the session resources.
  homework:
  - >-
    Finish your profile upgrade and ask your accountability partner for one improvement. If you prefer not to change a public profile, write the improved
    photo choice, headline and bio in a private document instead.
  - Practise your 30-second pitch aloud three times; record it on your phone once and listen back.
  - Make sure two-step verification is on for email and WhatsApp.
  cross_track_notes:
  - >-
    AI awareness here is the shared minimum for everyone. The AI Tools track goes much deeper (prompt engineering, research, automation, evaluation). Other
    tracks use AI only as an optional helper with the same disclosure rule.
  - Professional online presence here is about the learner as a person. Digital Marketing session 3 applies the same ideas to a business's presence and
    reputation.
