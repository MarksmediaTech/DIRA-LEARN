# DIRA LEARN V13 curriculum source: Entrepreneurship & Business specialist track. Six sessions of 120 minutes (timetable unchanged).
# Session 4 'Value proposition and business model' was approved by DIRA on 8 Nov 2026. Its curriculum record (title, description,
# activities, approved topics, output) is preserved exactly; the detailed lesson plan below builds on it without changing it.
track: entrepreneurship
track_name: Entrepreneurship & Business
track_focus: >-
  Turn an idea into a tested business concept. Learners spot opportunities, understand customer problems and markets, design a value proposition and business
  model, learn practical money skills (costing, pricing, revenue, expenses and cash flow), market and sell ethically with good customer service, test their
  idea with real customers, and pitch a business concept.
project: >-
  Final project - a business concept and pitch for an early-stage idea. It includes an opportunity statement backed by customer interviews, a value proposition,
  a one-page business model, a start-up budget and one-month cash-flow estimate with pricing, a one-page marketing and customer-experience plan, evidence
  from at least one real test, a 3-minute pitch in session 8 and a 30-day validation action. Privacy option: the business can be a simulated idea, and customer
  evidence is shown in the pitch without names, photos or contact details unless the person agreed.
sessions:
- session_no: 3
  week_no: 2
  duration: 120
  title: Opportunity spotting
  description: Identify customer needs and business opportunities; distinguish assumptions from evidence.
  purpose: >-
    Learners learn to find business opportunities in real problems around them, understand customers' problems deeply, do simple market research, and describe
    customer needs and target markets. They separate assumptions from evidence, prepare an interview guide and write a one-page opportunity statement.
  objectives:
  - Identify business opportunities from problems, trends, skills and resources in their community
  - Describe a customer problem in terms of the job the customer is trying to do, their pains and the gains they want
  - Distinguish assumptions from evidence and list the riskiest assumptions in an idea
  - Plan simple market research using primary (observation, interviews, surveys) and secondary (reports, data) sources
  - Describe a target market and early adopters for an idea
  - Conduct a practice customer interview using good, non-leading questions
  - Write a one-page opportunity statement
  topics:
  - title: Identifying business opportunities
    subtopics:
    - Problems as opportunities
    - Trends (mobile money, online shopping, climate, urbanisation)
    - Your skills, networks and resources
    - Gaps in local markets
    - Opportunity versus idea
  - title: Understanding customer problems
    subtopics:
    - The job the customer is trying to do
    - Pains and gains
    - How customers solve the problem today
    - Frequency and intensity of the problem
    - Willingness to pay
  - title: Market research
    subtopics:
    - Primary research - observation, interviews, short surveys
    - Secondary research - KNBS data, county information, industry reports, news
    - Asking good questions (past behaviour, not opinions about the future)
    - Avoiding leading questions
  - title: Customer needs and target markets
    subtopics:
    - Segments
    - Target market
    - Early adopters
    - Rough market size (how many, how often, how much)
    - Competition and alternatives
  - title: Assumptions versus evidence
    subtopics:
    - Listing assumptions
    - Riskiest assumptions first
    - What counts as evidence
  segments:
  - minutes: 10
    title: Welcome to Entrepreneurship & Business and track overview
    kind: introduction
    summary: Meet your track group and see the six sessions and final business pitch.
    steps:
    - >-
      Show the journey: S3 opportunity spotting, S4 value proposition and business model, S5 money - costing, pricing and cash flow, S6 marketing, customer
      experience and sales, S7 test and pitch, S8 pitch showcase.
    - Explain the final project - a tested business concept and a 3-minute pitch. Say that the goal is evidence, not a perfect plan.
    - Ask learners to share in one sentence a business they admire in their area and why.
  - minutes: 20
    title: Identifying business opportunities
    kind: lesson
    summary: Learn where business opportunities come from and how to spot them.
    steps:
    - >-
      Define an opportunity: a problem or need that enough people have, that they would pay to solve, and that you can realistically solve. An idea is a
      possible solution; an opportunity is the problem plus a market.
    - >-
      Sources of opportunities: (1) problems people complain about (water shortages, unreliable deliveries, expensive school uniforms); (2) trends (mobile
      money, online shopping, solar, recycling, urban farming, a growing youth population); (3) your skills and networks (you can cook, fix phones, know
      farmers); (4) gaps (no laundry service near a university hostel).
    - >-
      Kenyan examples: a young person in Nakuru who saw students struggling to dry clothes in the rainy season and started a laundry pick-up service; a
      group in Machakos turning mango waste into dried mango snacks; a Kibera youth group collecting plastic for recycling companies.
    - >-
      Opportunity filter - ask four questions: Is the problem real and frequent? Do people pay to solve it today? Can I reach these customers? Can I start
      small with what I have?
    - Learners list three problems they have seen this week in their community.
  - minutes: 20
    title: Understanding customer problems
    kind: lesson
    summary: Look at problems from the customer's point of view - the job, the pains and the gains.
    steps:
    - >-
      The job: what the customer is trying to get done. A mother buying a school uniform is not buying cloth; she is getting her child ready for school
      on time, looking smart, within budget.
    - >-
      Pains: what annoys, costs or worries them (long queues, poor quality, prices going up, unreliable sellers). Gains: what would delight them (durability,
      delivery, paying in instalments with M-Pesa).
    - 'How they solve it today: the current alternative is your real competition - even if it is ''doing nothing'' or ''asking a cousin''.'
    - >-
      Frequency, intensity and willingness to pay: a problem that happens daily and hurts a lot is a better opportunity than one that happens once a year
      and is mildly annoying.
    - >-
      Assumptions versus evidence: 'students will pay KES 100 for laundry pick-up' is an assumption until real students say they have paid for similar services
      or actually pay. List assumptions and mark the riskiest - the one that would kill the idea if wrong.
    - Work through one learner's problem as a group, mapping job, pains, gains and assumptions on the board.
  - minutes: 15
    title: Market research and target markets
    kind: lesson
    summary: Learn simple ways to research a market and define your target customers.
    steps:
    - >-
      Primary research: observe (count customers at a competitor's stall at different times), interview (ten conversations teach more than a hundred opinions
      online), short surveys (a Google Form shared in a relevant WhatsApp group, with the admin's permission).
    - >-
      Secondary research: the Kenya National Bureau of Statistics (KNBS) publishes population and economic data; county governments publish plans and statistics;
      industry and news reports give trends. Always note the source and date.
    - >-
      Target market and early adopters: the target market is the specific group you serve first; early adopters are the people with the problem most urgently
      who are already trying to solve it - they will try something new first.
    - >-
      Rough market size: how many potential customers in your area, how often they buy, and how much they spend. Example - 2,000 students in nearby hostels,
      30% send laundry out, twice a month, KES 150 each.
    - 'Competition and alternatives: who else solves the problem and how; what you could do differently.'
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 15
    title: Demonstration - good and bad customer interviews
    kind: demonstration
    summary: See the difference between a leading interview and a good one that uncovers real behaviour.
    steps:
    - >-
      Role-play a bad interview with a co-facilitator or volunteer: 'Would you buy my amazing juice? It is healthy and cheap, don't you think?' Point out
      leading questions, talking about the idea, and asking about the future.
    - >-
      Role-play a good interview: 'Tell me about the last time you bought juice or a snack in the afternoon. Where? How much? What did you like or dislike?
      What else did you consider?' Point out questions about past behaviour, listening more than talking, and not pitching.
    - >-
      Share the interview guide template: warm-up, the problem (last time it happened), current solution, pains, spending, what an ideal solution would
      do, permission to follow up. Ten questions maximum.
  - minutes: 15
    title: Interview guide and practice interviews
    kind: group
    summary: Write your interview guide and practise interviewing in pairs.
    steps:
    - >-
      Learners choose the opportunity they will develop for the track (from their three problems or an existing idea) and write an interview guide of eight
      to ten questions.
    - >-
      In pairs, learners interview each other (5 minutes each) as if the partner were a potential customer. The interviewer notes what they learned; the
      partner gives feedback on any leading questions.
    - Learners revise their guide based on the feedback.
  - minutes: 15
    title: Opportunity statement
    kind: exercise
    summary: Write a one-page opportunity statement for your idea.
    steps:
    - >-
      Learners complete the one-page opportunity statement: the problem, who has it (target market and early adopters), how they solve it today, why that
      is not good enough, the opportunity, rough market size, top three assumptions (riskiest first), and how they will gather evidence this week.
    - The facilitator checks a few statements and gives quick feedback on specificity.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Ask two learners to read their opportunity sentence.
    - Set the homework - at least five real interviews before session 4.
  demonstrations:
  - title: Bad versus good customer interview
    steps:
    - Role-play a leading interview and a good one, then debrief the differences.
  guided_exercises:
  - title: Opportunity filter
    instructions: Run your three problems through the four opportunity filter questions and choose one.
  - title: Job, pains and gains
    instructions: Map the job, pains, gains and current alternatives for your chosen problem.
  individual_activities:
  - title: Interview guide
    instructions: Write eight to ten non-leading questions about past behaviour, current solutions, pains and spending.
  - title: Opportunity statement
    instructions: Complete the one-page opportunity statement including your top three assumptions.
  group_activities:
  - title: Practice interviews
    instructions: Interview a partner for five minutes each and get feedback on leading questions.
  examples:
  - A laundry pick-up service for university students in Nakuru.
  - Dried mango snacks from mango waste in Machakos.
  - A Kibera youth group collecting plastic for recycling companies.
  - A second-hand school uniform exchange in Kisii before school opening.
  tools:
  - Interview guide template, opportunity statement template
  - KNBS and county government websites (for secondary research)
  - Phone for notes or recording (with permission)
  assessment:
  - question: What is the difference between an idea and an opportunity?
    guide: An idea is a possible solution; an opportunity is a real problem with customers willing to pay that you can reach.
  - question: Rewrite this leading question - 'Would you buy my cheap healthy juice?'
    guide: Ask about past behaviour, for example 'Tell me about the last time you bought a drink in the afternoon.'
  - question: What is the riskiest assumption in your idea?
    guide: The assumption that would end the idea if wrong (often willingness to pay or reaching customers).
  - question: Name one primary and one secondary research method.
    guide: Primary - interviews, observation, surveys. Secondary - KNBS data, county reports, news, industry reports.
  - question: Who are early adopters?
    guide: Customers who feel the problem most and are already looking for solutions; they try new things first.
  expected_outputs:
  - Three community problems and an opportunity chosen with the filter
  - Interview guide (eight to ten questions)
  - One-page opportunity statement with top three assumptions
  facilitator:
    preparation:
    - Prepare the interview guide and opportunity statement templates and the role-play script.
    - Arrange a co-facilitator or volunteer for the role-play.
    delivery:
    - Learners often fall in love with their idea; keep bringing them back to the customer's problem and evidence.
    - Encourage learners to work on ideas they can test cheaply in the next three weeks.
    inclusion_and_safeguarding:
    - Interviews in the community must be safe - interview in public places or by phone, never alone at a stranger's home, and tell someone where you are.
    - Do not interview children for business research.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    after_session:
    - Check opportunity statements and give each learner one question to explore in interviews.
    - Record attendance.
  homework:
  - >-
    Conduct at least five real customer interviews using your guide and record what you learned (quotes, numbers, surprises). Tell each person why you are
    asking and that they can decline; record answers without names unless they agree.
  - Find one piece of secondary data about your market (with source and date).
  cross_track_notes:
  - >-
    Digital Marketing also studies customers, but to plan channels and messages for an existing offer. Here learners study customers to decide whether a
    business is worth starting at all.
- session_no: 4
  week_no: 2
  duration: 120
  title: Value proposition and business model
  description: Describe customer value and map a simple business model.
  preserve_approved_record: true
  purpose: >-
    Learners turn interview evidence into a clear value proposition and map how their business would create, deliver and capture value on a simplified business
    model canvas. They see at business-model level how the approved digital marketing topics fit the 'channels' and 'customer relationships' parts of the
    model, and test their model through a peer challenge. This session follows the session record approved by DIRA on 8 Nov 2026.
  objectives:
  - Summarise customer interview evidence into jobs, pains and gains
  - Design a value proposition that matches products and services to customer pains and gains
  - Write a one-sentence value proposition statement
  - Explain the parts of a simplified business model canvas and common business model types in Kenya
  - Choose how customers will be reached and kept (channels and relationships), including the role of digital marketing
  - Map a one-page business model and defend it in a peer challenge
  topics:
  - title: Value propositions
    subtopics:
    - Customer profile - jobs, pains, gains
    - Value map - products and services, pain relievers, gain creators
    - Fit between customer and offer
    - Value proposition statement
    - Differentiation from alternatives
  - title: Business models
    subtopics:
    - >-
      Simplified business model canvas - customers, value proposition, channels, customer relationships, revenue streams, key activities, key resources,
      key partners, costs
    - Business model types - product sales, services, subscriptions, commissions and marketplaces, rental, freemium
    - Kenyan examples
  - title: Reaching and keeping customers in the business model
    subtopics:
    - Channels - how customers find, buy and receive
    - Digital marketing as a channel - social media, WhatsApp Business, content, advertising, search and measuring results (approved topics, business-model
      level)
    - Customer relationships - self-service, personal service, community
  - title: Peer challenge
    subtopics:
    - Testing the logic of a model
    - Asking hard questions respectfully
    - Revising the model
  segments:
  - minutes: 10
    title: Recap and interview findings
    kind: introduction
    summary: Share what your customer interviews revealed.
    steps:
    - Ask four learners to share one surprise from their interviews (a quote, a number or a behaviour).
    - Highlight learners whose interviews changed their idea - that is a success, not a failure.
  - minutes: 20
    title: Value propositions
    kind: lesson
    summary: Learn how to match your offer to customers' jobs, pains and gains.
    steps:
    - >-
      Draw the value proposition canvas. Customer profile (circle) - jobs, pains, gains from interviews. Value map (square) - products and services, pain
      relievers (how you reduce pains), gain creators (how you create gains). Fit = your pain relievers and gain creators address the most important pains
      and gains.
    - >-
      Worked example - laundry pick-up for students. Pains - no space to dry clothes, rain, time lost walking to the laundry. Pain relievers - pick-up from
      the hostel, dried and folded within 24 hours. Gains - more free time, clean clothes for events. Gain creators - weekly subscription, M-Pesa payment,
      WhatsApp reminders.
    - >-
      Value proposition statement formula: 'For [target customer] who [need or problem], [business name] is a [category] that [key benefit]. Unlike [alternative],
      we [key difference].' Example - 'For students in Nakuru hostels who have no time or space to wash and dry clothes, Fresh Fold is a laundry pick-up
      service that returns clothes clean and folded within 24 hours. Unlike hand-washing or walking to town, we collect from your hostel and you pay by
      M-Pesa.'
    - 'Differentiation: why customers would choose you over the current alternative - faster, cheaper, closer, more reliable, more convenient, better quality.'
  - minutes: 15
    title: Your value proposition
    kind: exercise
    summary: Complete the value proposition canvas and statement for your idea using interview evidence.
    steps:
    - Learners fill the customer profile with evidence from their interviews (mark each item with the number of interviewees who mentioned it).
    - They fill the value map and check that each top pain and gain has a pain reliever or gain creator.
    - They write the one-sentence value proposition statement and read it to a partner, who says whether it is clear and believable.
  - minutes: 20
    title: Business models and the simplified canvas
    kind: lesson
    summary: Learn the parts of a business model and common model types in Kenya.
    steps:
    - >-
      Explain the simplified business model canvas - nine boxes: customers (who); value proposition (what); channels (how they find, buy and receive); customer
      relationships (how you keep them); revenue streams (how money comes in); key activities (what you must do); key resources (what you need - people,
      equipment, money, skills); key partners (who helps - suppliers, riders, landlords); costs (what you spend).
    - Fill the canvas for Fresh Fold as a worked example, box by box.
    - >-
      Business model types with Kenyan examples: product sales (a juice vendor); services (a mobile phone repair shop); subscriptions (weekly laundry, gym
      membership); commissions and marketplaces (platforms that connect sellers and buyers and take a fee); rental (renting out tents and chairs for events);
      freemium (free basic service, paid premium).
    - Ask learners which model type fits their idea and whether a different one could work better.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 10
    title: Reaching and keeping customers - marketing in the business model
    kind: lesson
    summary: See where the approved digital marketing topics fit in the channels and relationships boxes of your model.
    steps:
    - >-
      Explain that channels and customer relationships are where marketing lives in a business model. For most young Kenyan businesses, the main channels
      are digital: social media (Facebook, Instagram, TikTok, LinkedIn), WhatsApp Business (catalogue, quick replies, status), content (photos, graphics
      in tools like Canva, captions with calls to action), and sometimes advertising and search (a Google Business Profile so people find you on Maps).
    - >-
      At the business-model level, decide three things: which two channels will bring your first customers, what one message will make them act, and how
      you will measure whether the channel works (enquiries, orders, cost per customer).
    - >-
      Explain that session 6 turns this into a one-page marketing plan, and that the Digital Marketing track teaches these channels in depth. Here the question
      is only whether the channels fit the customers and the costs in the model.
  - minutes: 20
    title: Map your one-page business model
    kind: exercise
    summary: Complete the simplified business model canvas for your idea.
    steps:
    - Learners complete the simplified canvas for their idea on one page, using their value proposition and interview evidence.
    - In the channels box, they choose two first channels and how they will measure them.
    - They mark each box as 'evidence' (from interviews or data) or 'assumption'.
    - The facilitator circulates and asks 'how do you know?' about key boxes (revenue and channels especially).
  - minutes: 15
    title: Peer challenge
    kind: group
    summary: Defend your business model against friendly but tough questions and improve it.
    steps:
    - >-
      In groups of three, one learner presents their model in 2 minutes; the other two act as challengers with question cards: 'Why would customers switch?',
      'How will the first 10 customers find you?', 'What does one customer cost you?', 'What happens if your key partner lets you down?', 'Which box is
      your biggest assumption?' Rotate.
    - Each learner notes the two hardest questions and revises their model or adds the question to their testing list for session 7.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Ask learners to name the box in their model with the weakest evidence.
    - Set the homework.
  demonstrations:
  - title: Value proposition canvas worked example
    steps:
    - Complete the canvas and statement for Fresh Fold laundry pick-up live.
  - title: Business model canvas worked example
    steps:
    - Fill all nine boxes for Fresh Fold, marking evidence and assumptions.
  guided_exercises:
  - title: Model type match
    instructions: Decide which business model type fits your idea and consider one alternative model.
  individual_activities:
  - title: Value proposition canvas and statement
    instructions: Complete the canvas with interview evidence and write your one-sentence statement.
  - title: One-page business model
    instructions: Complete the simplified business model canvas and mark each box as evidence or assumption.
  group_activities:
  - title: Peer challenge
    instructions: Present your model for two minutes and answer challenge questions from two peers; then swap roles.
  examples:
  - Fresh Fold laundry pick-up for students in Nakuru.
  - A juice vendor (product sales), a phone repair shop (service), a tent and chair hire business (rental).
  - A Kisumu fish seller who reaches office workers through WhatsApp status and delivers by boda boda.
  tools:
  - Value proposition canvas and simplified business model canvas templates
  - Challenge question cards
  - Interview notes from homework
  assessment:
  - question: Write your value proposition statement.
    guide: Names the target customer, need, category, key benefit and difference from alternatives.
  - question: Name five boxes of the simplified business model canvas.
    guide: Any five of customers, value proposition, channels, relationships, revenue streams, key activities, key resources, key partners, costs.
  - question: Which business model type is a weekly laundry service, and why?
    guide: Subscription (recurring payment for ongoing service); could also be a service model.
  - question: What two channels will bring your first customers, and how will you measure them?
    guide: Specific channels linked to the target customer and a measurable indicator.
  - question: Which box of your model is the biggest assumption?
    guide: Honest identification, usually revenue, channels or willingness to pay.
  expected_outputs:
  - Value proposition canvas and one-sentence statement
  - One-page business model (simplified canvas) with evidence and assumptions marked
  - Peer challenge notes and a revised model
  facilitator:
    preparation:
    - Prepare the canvases, the Fresh Fold worked example and the challenge question cards.
    - >-
      Note that this session's curriculum record was approved by DIRA on 8 Nov 2026; deliver its approved activities (simplified business model canvas and
      peer challenge) and output (one-page business model) as written.
    delivery:
    - Keep marketing content at the business-model level; learners who want more should be pointed to the Digital Marketing track resources.
    - Make learners show evidence; praise honest 'assumption' labels.
    inclusion_and_safeguarding:
    - Keep the peer challenge respectful - challenge the idea, never the person.
    after_session:
    - Review business models and note the biggest assumption for each learner to test in session 7.
    - Record attendance.
  homework:
  - Show your value proposition statement to two potential customers and record their reactions.
  - List every cost you think your business will have (start-up and monthly) and find real prices for at least five of them.
  cross_track_notes:
  - >-
    The digital marketing topics approved for this session are taught here only at business-model level (which channels, what message, how to measure).
    The Digital Marketing track teaches the same channels in depth; this avoids repeating the full content.
- session_no: 5
  week_no: 3
  duration: 120
  title: Basic venture finance
  description: Identify start-up and operating costs, price, revenue and simple cash flow.
  purpose: >-
    Learners build basic financial literacy for running a small business - separating business and personal money, keeping records, understanding credit
    - and learn to cost a product, set a price, calculate profit and break-even, and plan cash flow. They produce a start-up budget, a one-month cash-flow
    estimate and a lean one-page business plan outline.
  objectives:
  - Explain why business and personal money must be separated and how to keep simple records (including M-Pesa statements)
  - Describe the risks and costs of borrowing (digital loans, Hustler Fund, chamas, SACCOs, banks)
  - Classify start-up and operating costs, and fixed and variable costs
  - >-
    Calculate variable cost per unit, contribution per unit, gross profit and fully allocated unit cost, and set a price using cost-plus, competitor and
    value methods
  - Calculate break-even in units using contribution per unit
  - Explain the difference between profit and cash flow, and build a one-month cash-flow estimate
  - Outline a lean one-page business plan
  topics:
  - title: Basic financial literacy for entrepreneurs
    subtopics:
    - Separating business and personal money
    - Simple record keeping (sales book, expense book, M-Pesa statements)
    - Paying yourself a fixed amount
    - Savings and emergency funds
    - Credit - digital loans, the Hustler Fund, chamas, SACCOs, banks, interest and the risk of debt
    - Tax basics - KRA PIN and why records matter
  - title: Pricing and costing
    subtopics:
    - Start-up versus operating costs
    - Fixed versus variable costs
    - Variable cost per unit and fully allocated unit cost
    - Cost-plus pricing
    - Competitor-based pricing
    - Value-based pricing
    - Discounts and their effect on profit
  - title: Revenue and expenses
    subtopics:
    - Revenue (sales)
    - Cost of goods sold
    - Contribution per unit and contribution margin
    - Gross profit and net profit
    - Simple monthly profit statement
    - Break-even
  - title: Cash-flow fundamentals
    subtopics:
    - Profit is not cash
    - Timing of money in and out
    - Credit sales and stock
    - One-month cash-flow estimate
    - Keeping a cash buffer
  - title: Business planning
    subtopics:
    - Lean one-page business plan
    - What to include
    - When a full business plan is needed (loans, investors, competitions)
  segments:
  - minutes: 10
    title: Recap and cost hunt results
    kind: introduction
    summary: Share the real costs you found.
    steps:
    - Ask learners to share one cost they found that surprised them (rent, permits, packaging, transport).
    - Explain that many small businesses in Kenya fail not because nobody buys, but because they do not know their numbers. Today is about numbers.
  - minutes: 15
    title: Basic financial literacy for entrepreneurs
    kind: lesson
    summary: Learn the money habits that keep a small business alive.
    steps:
    - >-
      Separate business and personal money: use a separate M-Pesa line, a till number or a separate account for the business. Mixing them makes it impossible
      to know if the business makes money.
    - >-
      Records: write every sale and expense daily in a book or simple sheet; download M-Pesa statements monthly. Records help you make decisions, apply
      for loans and handle tax.
    - Pay yourself a fixed amount instead of taking money from the till whenever you need it.
    - 'Savings: set aside a little each week for emergencies and stock.'
    - >-
      Credit: digital loans are quick but can be expensive and can lead to a cycle of borrowing; late repayment can affect your credit record with credit
      reference bureaus. Government funds such as the Hustler Fund, chamas and SACCOs are alternatives with different terms. Before borrowing, ask - what
      exactly will this money buy, how will it bring more income, and what is the total amount I will repay?
    - >-
      Tax basics: registering for a KRA PIN is required for many formal activities; keeping records makes tax obligations easier to meet. Check current
      requirements on the official KRA website.
  - minutes: 20
    title: Costing
    kind: lesson
    summary: Classify your costs and calculate the cost of one unit.
    steps:
    - >-
      Start-up costs (once, before opening): equipment, first stock, registration and permits, initial branding. Operating costs (every month): rent, stock,
      transport, data, wages, packaging.
    - >-
      Fixed costs (same every month regardless of sales): rent, a stall fee, a salary. Variable costs (change with each unit sold): ingredients, packaging,
      delivery per order.
    - >-
      Variable cost per unit - a juice business. Per 500 ml bottle: fruit KES 25, sugar and water KES 5, bottle and label KES 15, fruit transport share
      KES 5. Variable cost per bottle = KES 50 (these are also the direct costs of making the product). Fixed costs per month: stall fee KES 3,000, blender
      depreciation KES 500, data KES 500 = KES 4,000.
    - >-
      Fully allocated unit cost = variable cost per unit + (fixed costs for the month / units sold in the month). At 300 bottles a month: 50 + 4,000 / 300
      = 50 + 13.33 = about KES 63 per bottle. At only 150 bottles it rises to 50 + 26.67 = about KES 77: fixed costs spread over fewer units, so each costs
      more.
    - Learners classify their own cost list into start-up or operating and fixed or variable.
  - minutes: 15
    title: Pricing and break-even
    kind: lesson
    summary: Set a price using three methods, then calculate contribution per unit and break-even.
    steps:
    - >-
      Cost-plus pricing: add a markup to cost. A 60% markup on the variable cost gives KES 50 + 30 = KES 80. Check it against the fully allocated unit cost
      at realistic sales (KES 63 at 300 bottles): KES 80 leaves about KES 17 per bottle after all costs.
    - 'Competitor-based pricing: what do similar juice sellers charge nearby? If they charge KES 70 to 100, KES 80 fits.'
    - 'Value-based pricing: what is it worth to the customer? Fresh juice delivered to offices may be worth KES 100.'
    - >-
      Two floors for any price: never below the variable cost per unit (every sale would lose money), and over the month the price must be above the fully
      allocated unit cost at your realistic sales volume, or the business makes a loss. Then check it fits the market and reflects the value.
    - >-
      Contribution per unit = price - variable cost per unit = KES 80 - 50 = KES 30. It is what each sale contributes towards fixed costs and then profit.
      Contribution margin = 30 / 80 = 37.5% of the price (a 60% markup on cost is a 37.5% margin on price - markup and margin are not the same).
    - >-
      Break-even (units) = fixed costs / contribution per unit = 4,000 / 30 = 133.3, so 134 bottles a month (round up) - about 5.2 a day over 26 trading
      days, so plan for at least 6. Check: at break-even the fully allocated unit cost (50 + 4,000 / 134 = about KES 80) equals the price.
    - >-
      Discounts: a 10% discount makes the price KES 72, so contribution falls from KES 30 to KES 22 per bottle - a 27% drop - and break-even rises from
      134 to 182 bottles (4,000 / 22 = 181.8). Use discounts carefully.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 20
    title: Revenue, expenses and cash flow
    kind: lesson
    summary: Understand profit and cash flow and why they differ.
    steps:
    - >-
      Simple monthly profit at 300 bottles: revenue 300 x KES 80 = KES 24,000; cost of goods sold (the direct costs of the bottles sold) 300 x KES 50 =
      KES 15,000; gross profit = revenue - cost of goods sold = KES 9,000; minus fixed costs KES 4,000 = net profit KES 5,000 (before tax). Here every variable
      cost is a direct product cost, so gross profit equals total contribution (300 x KES 30). If a business also has variable selling costs, such as a
      delivery rider paid per order or an agent's commission, those reduce contribution but not gross profit, and the two figures differ. Check: fully allocated
      cost 300 x KES 63.33 = KES 19,000, and 24,000 - 19,000 = KES 5,000.
    - >-
      Formula card for the finance template: variable cost per unit = sum of the costs of one unit; contribution per unit = price - variable cost per unit;
      contribution margin = contribution per unit / price; gross profit = revenue - cost of goods sold; net profit = gross profit - fixed (and other operating)
      costs; fully allocated unit cost = variable cost per unit + fixed costs / units; break-even units = fixed costs / contribution per unit, rounded up.
    - >-
      Cash flow is the timing of money in and out. A business can be profitable on paper and still run out of cash - for example if an office pays at month-end
      but you must buy fruit every morning.
    - >-
      Show a one-month cash-flow table by week: opening cash, cash in (sales paid), cash out (stock, rent, transport), closing cash. Show a week where closing
      cash goes negative and discuss solutions (smaller stock purchases, deposits from customers, shorter credit, a cash buffer).
    - Credit sales and stock both tie up cash; record who owes you and follow up politely.
  - minutes: 20
    title: Start-up budget and one-month cash flow
    kind: exercise
    summary: Build your start-up budget, unit cost, price, break-even and one-month cash-flow estimate.
    steps:
    - >-
      Learners complete the finance template (Google Sheets or paper): start-up budget with real prices where possible; variable cost per unit and fully
      allocated unit cost at their expected sales; price with a reason (cost-plus, competitor and value checked); contribution per unit; break-even units
      per month; gross and net profit for the month; one-month cash flow by week with realistic sales assumptions.
    - Learners highlight every number that is a guess rather than a researched price.
    - The facilitator circulates, checking arithmetic and asking 'where did this number come from?'.
    - Learners swap with a partner who checks one calculation.
  - minutes: 10
    title: Lean one-page business plan
    kind: lesson
    summary: Learn the outline of a lean business plan and when a full plan is needed.
    steps:
    - >-
      Explain the lean one-page plan: problem, customer, value proposition, solution, channels, revenue and price, costs, key numbers (break-even, monthly
      target), team, next milestones and what you need (money, partners, skills).
    - A full business plan is usually needed when applying for loans, grants, investors or competitions; the one-page plan is the starting point.
    - Learners start their one-page plan outline, filling what they already have from sessions 3 to 5.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Ask learners to share their break-even number and whether it feels achievable.
    - Set the homework.
  demonstrations:
  - title: Juice business numbers
    steps:
    - >-
      Walk through variable cost per unit, fully allocated unit cost, pricing, contribution per unit, break-even, gross and net profit, and a cash-flow
      table for the juice example, using the formula card.
  - title: Cash runs out
    steps:
    - Show a profitable month that still has a negative cash week, and two ways to fix it.
  guided_exercises:
  - title: Cost sorting
    instructions: Sort your costs into start-up or operating and fixed or variable.
  - title: Discount effect
    instructions: Calculate how a 10% discount changes your contribution per unit and your break-even.
  individual_activities:
  - title: Finance template
    instructions: >-
      Complete the start-up budget, variable and fully allocated unit cost, price, contribution per unit, break-even, monthly gross and net profit and one-month
      cash flow, highlighting guesses.
  - title: One-page plan outline
    instructions: Start the lean one-page business plan with what you have from sessions 3 to 5.
  group_activities:
  - title: Number check
    instructions: Swap templates with a partner and check one calculation each.
  examples:
  - A juice business with a KES 50 variable cost per bottle, a fully allocated cost of about KES 63 at 300 bottles a month, and a KES 80 price.
  - A Kericho mama mboga who separated her M-Pesa line and found she was losing money on transport.
  - A Nairobi phone repair technician who ran out of cash because customers collected phones on credit.
  - Comparing a digital loan with a chama loan for buying stock.
  tools:
  - Finance template (Google Sheets or paper) and calculator
  - Cost lists and price research from homework
  - Lean one-page business plan template
  assessment:
  - question: Classify rent and packaging as fixed or variable costs.
    guide: Rent is fixed; packaging is variable.
  - question: >-
      Your variable cost per unit is KES 120, your fully allocated unit cost at expected sales is KES 150, and competitors charge KES 180 to 220. Suggest
      a price and explain.
    guide: >-
      A price above KES 150 (for example KES 190-200), justified by value or difference and checked against competitors; never below KES 120, and above
      KES 150 to make a profit at the expected volume.
  - question: Fixed costs are KES 6,000 a month and contribution per unit is KES 40. What is break-even?
    guide: 6,000 / 40 = 150 units a month.
  - question: >-
      Variable cost per unit is KES 50, fixed costs are KES 4,000 a month and you expect to sell 200 units at KES 90. Work out the contribution per unit
      and the fully allocated unit cost.
    guide: Contribution = 90 - 50 = KES 40; fully allocated unit cost = 50 + 4,000 / 200 = KES 70.
  - question: Why can a profitable business run out of cash?
    guide: Timing - money goes out before it comes in (stock, credit sales, irregular payments).
  - question: Name two questions to ask before taking a loan.
    guide: What it will buy and how it brings income; total repayment and ability to repay; alternatives.
  expected_outputs:
  - Start-up budget with researched prices
  - Variable and fully allocated unit cost, price, contribution per unit, gross profit and break-even calculation
  - One-month cash-flow estimate
  - Lean one-page business plan outline (started)
  facilitator:
    preparation:
    - Prepare the finance template in Google Sheets with formulas and a paper version, and the juice worked example.
    - >-
      Check current official information on KRA PIN registration and government youth funds if you plan to mention specifics; do not give financial advice
      beyond the basics.
    delivery:
    - Go slowly on arithmetic; some learners fear numbers. Use the same example throughout.
    - Praise honest 'guess' labels and push for researched prices.
    inclusion_and_safeguarding:
    - Money and debt can be sensitive; never ask learners about personal debts publicly.
    - If a learner discloses serious financial exploitation or pressure, follow up privately and use the DIRA LEARN support routes.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    after_session:
    - Check finance templates for errors and give feedback.
    - Record attendance.
  homework:
  - Replace at least three guesses in your finance template with researched numbers.
  - Show your price to three potential customers and record their reactions.
  cross_track_notes:
  - >-
    Digital Marketing budgets only a campaign and its cost per result. Entrepreneurship & Business budgets the whole business - start-up costs, pricing,
    profit and cash flow.
- session_no: 6
  week_no: 3
  duration: 120
  title: Marketing and customer experience
  description: Choose channels, create marketing messages and practise ethical selling.
  purpose: >-
    Learners plan how to brand and market their small business on a small budget, design a customer experience that brings people back and handle complaints
    well, and practise ethical sales conversations and negotiation with customers and suppliers. They produce a one-page marketing plan, a customer journey
    map and a sales script.
  objectives:
  - Describe a simple brand for a small business (name, promise, look) and position it against alternatives
  - Build a one-page marketing plan (target customer, message, channels, offer, budget, measures)
  - Map the customer journey and design service standards for key moments
  - Handle a customer complaint professionally
  - Use ethical sales techniques - needs questions, benefits, handling objections, closing
  - Negotiate with a supplier or customer using preparation, options and a walk-away point
  topics:
  - title: Branding and marketing a small business
    subtopics:
    - Simple brand - name, promise, look
    - Positioning against alternatives
    - Product, price, place and promotion
    - Low-cost marketing - word of mouth, referrals, community, WhatsApp, social media
    - One-page marketing plan
  - title: Customer service and customer experience
    subtopics:
    - Customer journey - before, during, after purchase
    - Moments of truth
    - Service standards
    - Handling complaints (listen, apologise, fix, follow up)
    - Repeat customers and referrals
  - title: Sales and negotiation
    subtopics:
    - Ethical selling
    - Needs questions
    - Features and benefits
    - Handling objections (price, trust, timing)
    - Closing and asking for the sale
    - Negotiation preparation - goal, options, walk-away point
    - Win-win with suppliers and customers
  segments:
  - minutes: 10
    title: Recap and price reactions
    kind: introduction
    summary: Share how customers reacted to your price.
    steps:
    - Learners share customer reactions to their price. Discuss what they will change (price, offer, target customer).
    - Introduce today - getting customers, keeping them and selling honestly.
  - minutes: 20
    title: Branding and marketing a small business
    kind: lesson
    summary: Plan a simple brand and low-cost marketing for your business.
    steps:
    - >-
      Simple brand: a memorable name, a promise customers can rely on ('Fresh juice, made this morning'), and a consistent look (colours, logo, clean stall
      or packaging).
    - 'Positioning: complete ''Customers choose us instead of [alternative] because [difference].'''
    - >-
      The 4Ps in plain words: Product (what exactly you sell), Price (from session 5), Place (where and how customers buy - stall, delivery, online), Promotion
      (how they hear about you).
    - >-
      Low-cost marketing for Kenyan small businesses: word of mouth and referrals (offer a reward for bringing a friend), community presence (chamas, churches,
      mosques, estate groups - with permission), a WhatsApp Business catalogue and status, one main social platform, signage and samples. The Digital Marketing
      track covers these channels in depth; here learners choose what fits their business and budget.
    - >-
      One-page marketing plan: target customer, key message, channels (two or three), offer for the first customers, budget, and measures (enquiries, sales,
      repeat customers).
  - minutes: 15
    title: One-page marketing plan
    kind: exercise
    summary: Write the one-page marketing plan for your business.
    steps:
    - Learners complete the one-page marketing plan using their business model and finance numbers.
    - Partners check that the marketing budget fits the finance template and that the channels match the target customer.
  - minutes: 20
    title: Customer service and customer experience
    kind: lesson
    summary: Design the experience that turns first-time buyers into repeat customers.
    steps:
    - >-
      Customer journey: before (hearing about you, asking questions), during (ordering, paying, receiving), after (using the product, follow-up, complaints,
      coming back). Draw it for the juice business.
    - 'Moments of truth: the points that decide whether customers return - the first reply on WhatsApp, the delivery time, the taste, how a complaint is
      handled.'
    - >-
      Service standards: simple promises you always keep, for example 'reply within 15 minutes during opening hours', 'deliver within an hour in town',
      'greet every customer by name if known'.
    - >-
      Complaints: Listen without interrupting, Apologise sincerely, Fix it (replace, refund or compensate fairly), Follow up. A well-handled complaint often
      creates a loyal customer.
    - 'Repeat customers and referrals: a thank-you message, a loyalty card (paper or WhatsApp stamps), asking happy customers to tell a friend.'
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 15
    title: Customer journey map and complaint role-play
    kind: exercise
    summary: Map your customer journey and practise handling a complaint.
    steps:
    - Learners map their customer journey (before, during, after), mark two moments of truth and write a service standard for each.
    - In pairs, role-play a complaint (a late delivery, a wrong item, a rude staff member) using Listen, Apologise, Fix, Follow up. Swap roles.
  - minutes: 15
    title: Sales and negotiation
    kind: lesson
    summary: Learn ethical selling and basic negotiation with customers and suppliers.
    steps:
    - 'Ethical selling: help the customer solve their problem; never lie, pressure or hide costs. Trust is the most valuable asset of a small business.'
    - >-
      Sales conversation: greet; ask needs questions ('What is it for?', 'When do you need it?', 'What have you tried?'); recommend and explain benefits;
      handle objections; ask for the sale ('Shall I put you down for Saturday delivery?').
    - >-
      Handling objections: price ('It is expensive' - explain value, offer a smaller option, never insult); trust ('How do I know it is good?' - samples,
      reviews, guarantee); timing ('Maybe later' - ask what would help them decide, follow up once).
    - >-
      Negotiation preparation: your goal, your options, your walk-away point (the worst deal you will accept), and what the other side needs. Look for win-win
      - a supplier may give a better price for regular orders or cash payment; a customer may accept a later delivery for a lower price.
    - 'Example: negotiating with a fruit supplier at Wakulima market - buying in bulk twice a week for a 10% lower price in return for reliable payment.'
  - minutes: 15
    title: Sales and negotiation role-play and sales script
    kind: group
    summary: Practise a sales conversation and a supplier negotiation, then write your sales script.
    steps:
    - >-
      In groups of three (seller, customer or supplier, observer), run two role-plays: a sales conversation with an objection card, and a supplier negotiation
      with a goal and walk-away card. The observer gives feedback.
    - >-
      Each learner writes a short sales script for their business - opening, three needs questions, key benefits, answers to the two most likely objections
      and a closing question.
  - minutes: 5
    title: Wrap-up and homework
    kind: conclusion
    summary: Summarise and confirm the homework.
    steps:
    - Ask learners to share the objection they find hardest to handle.
    - Set the homework and explain that session 7 is about testing the idea with real customers and preparing the pitch.
  demonstrations:
  - title: Complaint handling
    steps:
    - Role-play a poor and a good response to a late-delivery complaint using Listen, Apologise, Fix, Follow up.
  - title: Sales conversation
    steps:
    - Role-play a sales conversation with a price objection, showing needs questions and an honest close.
  guided_exercises:
  - title: Positioning sentence
    instructions: Complete 'Customers choose us instead of [alternative] because [difference].'
  individual_activities:
  - title: One-page marketing plan
    instructions: Write your target customer, key message, channels, first-customer offer, budget and measures.
  - title: Customer journey map
    instructions: Map before, during and after purchase, mark two moments of truth and write a service standard for each.
  - title: Sales script
    instructions: Write an opening, needs questions, benefits, objection answers and a closing question.
  group_activities:
  - title: Complaint role-play
    instructions: In pairs, handle a complaint using Listen, Apologise, Fix, Follow up.
  - title: Sales and negotiation role-plays
    instructions: In threes, practise a sales conversation and a supplier negotiation with an observer giving feedback.
  examples:
  - A Wakulima market fruit supplier negotiation for a juice business.
  - A Thika salon that sends a thank-you WhatsApp message and a loyalty stamp after each visit.
  - A Kisii shoe repairer who turned a complaint into a loyal customer by fixing the shoe for free and following up.
  tools:
  - One-page marketing plan, customer journey map and sales script templates
  - Objection cards and negotiation cards
  assessment:
  - question: Write your positioning sentence.
    guide: Names a real alternative and a believable difference.
  - question: What are the four steps for handling a complaint?
    guide: Listen, Apologise, Fix, Follow up.
  - question: A customer says 'It is too expensive.' Give an ethical response.
    guide: Explain value, offer a smaller or different option, never pressure or insult.
  - question: What is a walk-away point in negotiation?
    guide: The worst deal you will accept; below it you walk away.
  - question: Name two moments of truth in your customer journey.
    guide: Specific moments that decide whether customers return.
  expected_outputs:
  - One-page marketing plan
  - Customer journey map with service standards
  - Sales script
  facilitator:
    preparation:
    - Prepare the templates and the objection and negotiation cards.
    delivery:
    - Role-plays are the heart of this session; keep lessons short and practice long.
    - Point learners who want deeper digital marketing to the Digital Marketing track resources.
    inclusion_and_safeguarding:
    - Keep role-plays respectful; no shaming of 'customers' or 'sellers'.
    - Remind learners that pressure selling and hidden charges harm customers and the business's reputation.
    after_session:
    - Review the marketing plans and sales scripts and give feedback.
    - Record attendance.
  homework:
  - Use your sales script with at least two real potential customers and note what happened.
  - Choose the riskiest assumption from your business model to test in session 7.
  cross_track_notes:
  - >-
    Digital Marketing teaches the online channels, copy and campaign measurement in depth. Here learners decide the overall marketing approach for the business,
    design the customer experience and practise face-to-face and phone selling and negotiation.
- session_no: 7
  week_no: 4
  duration: 120
  title: Test and pitch
  description: Use feedback to improve an idea and present a concise business pitch.
  purpose: >-
    Learners design and run a small, cheap test of their riskiest assumption, decide what the evidence means, complete their lean business plan with legal
    and funding next steps, and build a 3-minute pitch backed by evidence. They review each other's pitches and revise their assumptions.
  objectives:
  - Design a test of their riskiest assumption (pre-orders, a pilot, a sample sale, a landing page or WhatsApp catalogue test)
  - Define what result would support or reject the assumption before testing
  - Interpret test evidence and decide to continue, change or stop
  - Complete a lean one-page business plan including legal basics and funding options as next steps
  - Build a 3-minute pitch (problem, solution, customer, evidence, model, money, team, ask)
  - Give and use peer feedback to improve the pitch
  topics:
  - title: Testing business ideas
    subtopics:
    - Minimum viable product
    - Test types - pre-orders, pilots, sample sales, smoke tests
    - Setting a success criterion before testing
    - Reading results honestly
    - Continue, change or stop
  - title: Business planning (completing the lean plan)
    subtopics:
    - Lean one-page plan
    - Legal basics - business name registration on eCitizen, KRA PIN, county permits (check current requirements)
    - Funding options - savings, family, chamas, SACCOs, youth and government funds, grants, competitions
    - Milestones
  - title: Pitching and presenting business ideas
    subtopics:
    - Pitch structure
    - Telling a story with evidence
    - Numbers that matter
    - The ask
    - Delivery - voice, timing, confidence
  segments:
  - minutes: 10
    title: Recap and sales script results
    kind: introduction
    summary: Share what happened when you used your sales script.
    steps:
    - Learners share what happened when they used their sales script with real customers.
    - Introduce the idea of testing - evidence beats opinions, including your own.
  - minutes: 20
    title: Testing business ideas
    kind: lesson
    summary: Learn how to test an idea quickly and cheaply before investing.
    steps:
    - >-
      Minimum viable product (MVP): the simplest version of your offer that lets you learn whether customers really want it - for example ten bottles of
      juice sold at an office, not a whole juice bar.
    - >-
      Test types: pre-orders (take orders and deposits before producing); pilots (serve five customers for a week); sample sales (sell a small batch at
      a market day); smoke tests (post the offer on WhatsApp status or a catalogue and count real enquiries before you have stock - be honest that it is
      a pre-launch).
    - >-
      Success criterion before testing: 'If at least 8 out of 20 office workers pre-order at KES 80, the willingness-to-pay assumption is supported.' Decide
      before you look at results so you do not fool yourself.
    - >-
      Reading results honestly and deciding: continue (evidence supports), change (pivot the customer, price or offer), or stop (save your money and time).
      Changing or stopping is learning, not failure.
    - 'Ethics: never take money for something you cannot deliver; refund pre-orders if you stop.'
  - minutes: 15
    title: Design your test
    kind: exercise
    summary: Design a test of your riskiest assumption with a clear success criterion.
    steps:
    - 'Learners complete the test card: riskiest assumption, test type, what they will do, who with, when, cost, success criterion, and how they will record
      results.'
    - Partners check that the test is cheap, quick (within one week), ethical and has a clear number as the success criterion.
    - Learners who already ran a test (homework) record the results and decision instead.
  - minutes: 15
    title: Completing the lean business plan
    kind: lesson
    summary: Add legal basics, funding options and milestones to your one-page plan.
    steps:
    - >-
      Legal basics as next steps (not required to test): business name registration through the eCitizen Business Registration Service, a KRA PIN, county
      single business permits, and any sector licences (food handling for food businesses). Requirements and fees change - check the official websites.
    - >-
      Funding options: own savings, family and friends (agree terms in writing), chamas and SACCOs, government youth and enterprise funds, grants and youth
      business competitions, and later investors. Match the funding to the need and repay what you borrow.
    - 'Milestones: the next three steps with dates (for example ''first 20 paying customers by end of January'').'
    - Learners finish their one-page plan.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 15
    title: Pitch structure
    kind: lesson
    summary: Learn the structure of a short business pitch.
    steps:
    - >-
      Pitch structure for 3 minutes: (1) hook - a story or a striking fact about the problem (20 seconds); (2) problem and customer (30 seconds); (3) solution
      and value proposition (30 seconds); (4) evidence - interviews, test results, pre-orders (30 seconds); (5) business model and key numbers - price,
      variable and fully allocated unit cost, contribution per unit, break-even (30 seconds); (6) team - you and why you (15 seconds); (7) the ask and next
      step (25 seconds).
    - 'The ask: what you want from the audience - advice, a first customer, a partner, a space, a small grant. Make it specific.'
    - 'Delivery: stand or sit tall, speak slowly, look at the audience or camera, use one simple visual or slide per part, practise with a timer.'
    - Show a 3-minute example pitch for Fresh Fold (recorded or live by the facilitator).
  - minutes: 25
    title: Build your pitch
    kind: exercise
    summary: Build your 3-minute pitch with your evidence and numbers.
    steps:
    - Learners write their pitch using the template and create up to five simple slides or a one-page visual.
    - They include at least one piece of real evidence (interview quotes, numbers, test results) and their key numbers from session 5.
    - They practise once alone with a timer.
  - minutes: 15
    title: Peer pitch review
    kind: group
    summary: Pitch to peers and use their feedback to improve.
    steps:
    - >-
      In groups of three, each learner pitches in 3 minutes. Peers use the pitch rubric (clear problem, credible solution, real evidence, sensible numbers,
      specific ask, delivery) and give two strengths and two improvements.
    - Learners revise their assumptions list and pitch based on the feedback.
  demonstrations:
  - title: Example pitch
    steps:
    - Deliver or play a 3-minute Fresh Fold pitch and point out each part of the structure.
  guided_exercises:
  - title: Success criterion
    instructions: Write a success criterion with a number for your riskiest assumption before testing.
  individual_activities:
  - title: Test card
    instructions: Design a cheap, quick, ethical test of your riskiest assumption with a clear success criterion.
  - title: Lean one-page plan
    instructions: Complete the plan including legal next steps, funding options and three milestones.
  - title: Three-minute pitch
    instructions: Build your pitch with real evidence, key numbers and a specific ask.
  group_activities:
  - title: Peer pitch review
    instructions: Pitch to two peers who use the rubric to give two strengths and two improvements.
  examples:
  - Pre-orders from 20 office workers for a juice delivery test.
  - A Kisii uniform exchange running a one-day pilot before school opening.
  - A Kitui solar lamp rental idea tested with five households for one week.
  tools:
  - Test card, lean plan and pitch templates, pitch rubric, timer
  - Business model, finance template and interview notes from earlier sessions
  assessment:
  - question: What is a minimum viable product?
    guide: The simplest version of an offer that lets you learn whether customers want it.
  - question: Why set a success criterion before testing?
    guide: To avoid interpreting results to fit what you hoped.
  - question: Name three parts of a business pitch.
    guide: Any three of hook, problem, solution, evidence, model and numbers, team, ask.
  - question: What should you do with pre-order money if you decide to stop?
    guide: Refund it.
  expected_outputs:
  - Test card (and results if already tested)
  - Completed lean one-page business plan
  - Three-minute pitch with up to five slides or a one-page visual
  - Peer review notes and revised assumptions
  facilitator:
    preparation:
    - Prepare the test card, lean plan and pitch templates, the pitch rubric and the example pitch.
    - Check current official information on business registration and permits if you plan to mention specifics.
    - >-
      Set the session 8 room plan from the track group size (up to 12 - one room; 13 to 24 - two rooms; 25 to 36 - three rooms, or two live rooms plus a
      recorded-questions room) and line up co-facilitators and peer panels.
    delivery:
    - Keep pushing for evidence; a pitch without evidence is a wish.
    - Learners whose test showed the idea does not work should be praised and helped to pitch what they learned and their changed idea.
    inclusion_and_safeguarding:
    - Tests must be ethical - no taking money for things learners cannot deliver; refunds if they stop.
    - Learners must not borrow money to run a test.
    - >-
      Consent and privacy: before using an identifiable person (face, voice or name), a photograph of someone, or a real business's name, logo, prices,
      customer details or results, the learner gets permission from that person or owner - in writing (a WhatsApp message is enough) for anything shown
      outside the class. Never children. Learners who cannot or do not wish to publish publicly use the private or simulated option, which is assessed with
      the same rubric and never marked down.
    after_session:
    - Check every learner has a pitch draft and a test plan; message those at risk.
    - Record attendance.
  homework:
  - >-
    Run your test this week and record the result and your decision (continue, change or stop). Keep tests honest: do not take money for something you cannot
    deliver, and do not share customers' details.
  - Add the result to your pitch and practise it three times within 3 minutes.
  - Upload your business concept (opportunity statement, business model, finance template, marketing plan, lean plan) to DIRA LEARN.
  - >-
    If you are presenting by recording (a large group, or you cannot present live), record your 3-minute pitch presentation - video, or a voice note with
    slides for low data - and upload it to DIRA LEARN by the day before session 8.
  cross_track_notes:
  - >-
    Every track builds its final project in session 7. The Entrepreneurship & Business project is judged on evidence, sound numbers and a clear pitch, not
    on how big the idea is.
- session_no: 8
  week_no: 4
  duration: 120
  title: Business pitch showcase
  description: Present an early-stage business concept and identify a realistic validation step.
  purpose: >-
    Learners pitch their early-stage business concept with evidence, answer questions about their numbers and assumptions, give and receive feedback, learn
    to present themselves as entrepreneurs and job candidates, and leave with a 30-day validation action plan.
  objectives:
  - Deliver a 3-minute business pitch with evidence and a specific ask
  - Answer questions about customers, numbers and assumptions
  - Give and receive feedback professionally using the rubric
  - Pitch themselves as entrepreneurs and as employable young people using the project as proof
  - Write a 30-day validation action plan
  topics:
  - title: Pitching and presenting business ideas
    subtopics:
    - Delivering the pitch
    - Answering questions
    - Handling tough questions calmly
  - title: Pitching yourself
    subtopics:
    - Entrepreneur self-pitch
    - Using the project in job applications - skills employers value
  - title: Professional behaviour and workplace readiness
    subtopics:
    - Showcase etiquette
    - Receiving critical feedback
    - Following up with guests and potential partners
    - Pathways - starting, joining a business, employment, further learning
  - title: Next steps
    subtopics:
    - 30-day validation plan
    - Support and networks for young entrepreneurs
  segments:
  - minutes: 10
    title: Showcase set-up and expectations
    kind: introduction
    summary: Learn the showcase order, rubric and etiquette.
    steps:
    - Welcome learners and guests (local entrepreneurs, DIRA staff, mentors, potential partners). Thank interviewees and test customers.
    - >-
      Share the rubric: problem and customer (20%), solution and value proposition (15%), evidence from testing (25%), business model and numbers (20%),
      pitch delivery and answers (20%).
    - Assign each learner two presenters to give written feedback to.
  - minutes: 30
    title: Pitches and questions - block 1
    kind: assessment
    summary: The first six presenters in each room pitch and answer questions; give rubric feedback to your two assigned peers.
    steps:
    - >-
      Run the pitches with the session 8 room plan in the facilitator instructions: the first six pitchers in each room go in this block, each with 3 minutes
      plus 2 minutes of questions.
    - Learners pitch in order, 3 minutes each plus 2 minutes of questions. Strict timer with a 30-second warning.
    - >-
      Ask at least one question per presenter, such as: 'How many customers have actually paid?', 'What is your break-even and how long will it take to
      reach?', 'What did your test tell you?', 'What would you do with KES 10,000?', 'What is your biggest risk?'
    - Score with the rubric and note one strength and one improvement.
  - minutes: 5
    title: Stretch break
    kind: break
    summary: A five-minute stretch and movement break (seated option available).
    steps:
    - Invite everyone to stand, stretch, walk or drink water for five minutes; offer a seated option for anyone who prefers or needs it.
    - Restart on time with a one-line reminder of where the session is and what comes next.
  - minutes: 30
    title: Pitches and questions - block 2
    kind: assessment
    summary: The next six presenters in each room pitch; recorded presenters answer their live questions.
    steps:
    - The remaining pitchers in each live room (7 to 12) go now, with the same timer, rubric and question approach as block 1.
    - >-
      In a recorded-questions room, do not replay the recordings (the panel scored them before the session); give each recorded presenter 2 minutes of live
      questions about their business pitch.
    - Each room's panel hands its completed business pitch rubric sheets to the room facilitator before the feedback round.
  - minutes: 10
    title: Feedback round
    kind: group
    summary: Share feedback and learn from patterns across pitches.
    steps:
    - Learners give written feedback to their two assigned presenters.
    - Facilitator highlights patterns in strong pitches - real evidence, honest numbers, a clear ask.
    - Model receiving tough feedback calmly - thank, clarify, decide.
  - minutes: 15
    title: Pitching yourself and workplace readiness
    kind: lesson
    summary: Use your business project to pitch yourself as an entrepreneur or job candidate.
    steps:
    - >-
      Entrepreneur self-pitch: 'I am Kevin from Kitui. I test ideas with real customers before spending money. I tested a solar lamp rental with five households;
      four paid on time and two referred neighbours. I am looking for a partner with a motorbike to expand deliveries.'
    - >-
      Employability: the project shows skills employers want - research, numeracy, customer service, sales, presenting and taking initiative. Practise describing
      it in an interview using situation, action and result.
    - >-
      Pathways: starting the business in small steps, joining a small business, employment while building the business on the side, further training; support
      networks such as county enterprise offices, youth business programmes and DIRA alumni. Beware of 'business opportunities' that ask for joining fees
      or promise quick returns (pyramid schemes).
    - 'Professional follow-up: thank guests and test customers within two days; follow up on any offer of help with a short, specific message.'
    - Learners practise their self-pitch once in pairs.
  - minutes: 15
    title: 30-day validation action plan
    kind: exercise
    summary: Write your next realistic validation step and a 30-day plan.
    steps:
    - >-
      Learners complete the 30-day validation plan: the main assumption still to test, the next validation step (for example 'get 20 paying customers',
      'run a two-week pilot'), four weekly actions, a measure of success, an accountability partner, one risk and a plan.
    - Learners share their next validation step with their accountability partner.
  - minutes: 5
    title: Celebration and close
    kind: conclusion
    summary: Celebrate and learn what happens next.
    steps:
    - Celebrate each learner's pitch in one sentence.
    - >-
      Explain how to submit the pitch deck, concept summary and 30-day validation action in DIRA LEARN, how results and certificates follow the programme's
      rules, and how alumni can connect with mentors and youth enterprise funding information.
  demonstrations:
  - title: Model pitch
    steps:
    - Before the session, share the recorded Fresh Fold example pitch as a reference. Do not use showcase time for it.
  guided_exercises:
  - title: Situation, action, result
    instructions: Describe your business project in interview style using situation, action and result.
  individual_activities:
  - title: Business pitch
    instructions: Deliver your 3-minute pitch with evidence and a specific ask, and answer questions for two minutes.
  - title: 30-day validation plan
    instructions: Complete the plan with the next validation step, weekly actions, measure, partner and risk.
  group_activities:
  - title: Peer feedback
    instructions: Give rubric-based written feedback to two assigned presenters.
  - title: Self-pitch practice
    instructions: Practise your entrepreneur self-pitch in pairs.
  examples:
  - A Kitui solar lamp rental pitch with a five-household test.
  - A Nakuru laundry pick-up pitch with 12 pre-orders from hostel students.
  - A learner who stopped a juice idea after testing and pitched a changed idea for office snack delivery.
  tools:
  - Learners' pitches (slides or one-page visuals), pitch rubric, feedback cards or DIRA LEARN
  - Timer and 30-day validation plan template
  assessment:
  - question: Pitch scored with the business pitch rubric.
    guide: Use rubric descriptors; evidence and honest numbers weigh most.
  - question: What is your next validation step and how will you measure it?
    guide: A specific, realistic step with a number.
  - question: Describe your project using situation, action and result.
    guide: Clear situation, own actions and a measurable result.
  expected_outputs:
  - Delivered business pitch (final project) with rubric score and feedback
  - Business concept summary (submitted in DIRA LEARN)
  - 30-day validation action plan
  - Written feedback given to two peers
  facilitator:
    preparation:
    - Publish the pitch order; check slides or visuals work.
    - Invite guests (local entrepreneurs, partners) and brief them on respectful questions and safeguarding expectations.
    - >-
      Confirm the room plan: count the learners in the track group, book the rooms and co-facilitators, brief the peer panels, and publish each room's presenter
      order and the list of recorded presenters by the end of session 7.
    delivery:
    - Keep strict time; protect nervous presenters from harsh questioning.
    - Celebrate learners who changed or stopped ideas based on evidence.
    - >-
      Session 8 room plan - Room plan (set in session 7 from the track group size; the session is never extended): up to 12 learners - one room; 13 to 24
      - two rooms in parallel; 25 to 36 - three rooms, or two live rooms plus one recorded-questions room. Each live room takes at most 12 presenters: 6
      in each 30-minute block, 3 minutes to present and 2 minutes of questions each.
    - >-
      Every room has a facilitator or briefed co-facilitator (another trainer, a mentor or DIRA staff member who knows the rubric and the safeguarding expectations)
      and a peer panel of two learners who present in the other block. All rooms use the same rubric.
    - >-
      Recorded option: learners in a recorded-questions room, and anyone who cannot present live (absence, connection problems, anxiety, or the privacy
      option), submit a 3-minute recording - video, or a voice note with slides for low data - by the day before session 8. The panel scores it in advance
      with the same rubric; in session 8 each recorded presenter answers 2 minutes of live questions (12 per block). If more learners need the recorded
      option than one room can take, the panel sends written questions and the learner answers them in DIRA LEARN.
    - 'Timekeeping: a visible timer with a 30-second warning; stop at 3 minutes. If a block runs late, cut questions to 1 minute - do not extend the session.'
    inclusion_and_safeguarding:
    - Learners who cannot present live can submit a recorded pitch according to the programme's rules.
    - Guests must not make funding or business offers directly to learners outside programme channels; route any offers through DIRA staff.
    after_session:
    - Enter rubric scores and feedback in DIRA LEARN grading.
    - Record attendance.
  homework:
  - Submit the pitch, business concept and 30-day validation plan in DIRA LEARN.
  - Send thank-you messages to the customers and guests who helped.
  cross_track_notes:
  - Every track ends with the same pitch-yourself and workplace-readiness segment; the Entrepreneurship & Business rubric weights evidence and numbers.
